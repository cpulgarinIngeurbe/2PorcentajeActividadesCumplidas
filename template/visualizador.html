<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programa de obra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  #mpp-root{
    --brand-start:#a2c617; --brand-end:#758b29;
    --ink:#1c1d18; --paper:#faf9f5; --line:#e6e7df; --steel:#758b29;
    --critical:#c0553d; --grid:#eceee2; --muted:#8e8d85;
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
    font-size:clamp(12px, 0.9vw + 8px, 14px);
    color:var(--ink); background:#fff;
    border:1px solid var(--line); border-radius:18px; overflow:hidden;
    box-shadow:0 1px 2px rgba(28,29,24,.04), 0 20px 48px rgba(28,29,24,.08);
  }
  #mpp-root *{box-sizing:border-box;}
  #mpp-root .hdr{
    background:linear-gradient(120deg, #23241c, #1c1d18 60%);
    color:#fff; padding:clamp(12px,1.6vw,20px) clamp(16px,2vw,26px);
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    border-bottom:3px solid; border-image:linear-gradient(90deg, var(--brand-start), var(--brand-end)) 1;
  }
  #mpp-root .hdr-brand{display:flex; align-items:center; gap:10px;}
  #mpp-root .hdr-logo{height:clamp(20px,2.2vw,28px); width:auto;}
  #mpp-root .hdr h1{font-size:clamp(13px,1vw,16px); font-weight:700; margin:0; letter-spacing:.02em;}
  #mpp-root .hdr .sub{font-size:11.5px; color:#c7c9b8; font-variant-numeric:tabular-nums;}
  #mpp-root .projectbar{
    display:flex; align-items:center; gap:10px; padding:clamp(10px,1.4vw,16px) clamp(16px,2vw,26px);
    background:#f6f7f2; border-bottom:1px solid var(--line); flex-wrap:wrap; font-size:12px;
  }
  #mpp-root .projectbar label{color:#5a5a4a; font-weight:600; white-space:nowrap;}
  #mpp-root .projectbar select{
    font-size:13px; padding:8px 12px; border:1px solid var(--line); border-radius:10px; background:#fff;
    min-width:240px; color:var(--ink);
  }
  #mpp-root .projectbar button{
    font-size:12.5px; padding:9px 18px; border:none;
    background:linear-gradient(135deg, var(--brand-start), var(--brand-end)); color:#16180f;
    border-radius:10px; cursor:pointer; font-weight:700; letter-spacing:.01em;
    box-shadow:0 1px 0 rgba(255,255,255,.25) inset, 0 6px 14px rgba(117,139,41,.28);
    transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  }
  #mpp-root .projectbar button:disabled{opacity:.45; cursor:not-allowed; box-shadow:none;}
  #mpp-root .projectbar button:hover:not(:disabled){transform:translateY(-1px); box-shadow:0 1px 0 rgba(255,255,255,.25) inset, 0 10px 18px rgba(117,139,41,.34);}
  #mpp-root .projectbar .status{color:#5a5a4a;}
  #mpp-root .toolbar{
    display:flex; align-items:center; gap:8px; padding:clamp(8px,1.2vw,12px) clamp(16px,2vw,26px);
    background:#fff; border-bottom:1px solid var(--line); flex-wrap:wrap;
  }
  #mpp-root .toolbar button{
    font-size:12px; padding:7px 14px; border:1px solid var(--line); background:#fff; color:#4a4a3d;
    border-radius:9px; cursor:pointer; font-weight:600; letter-spacing:.01em; transition:all .12s ease;
  }
  #mpp-root .toolbar button.active{
    background:linear-gradient(135deg, var(--brand-start), var(--brand-end)); color:#16180f; border-color:transparent;
    box-shadow:0 4px 10px rgba(117,139,41,.28);
  }
  #mpp-root .toolbar button:hover{border-color:var(--brand-end); color:var(--brand-end);}
  #mpp-root .toolbar button.active:hover{color:#16180f;}
  #mpp-root #level-buttons{display:contents;}
  #mpp-root .filterbar{
    padding:clamp(8px,1.2vw,12px) clamp(16px,2vw,26px); background:#fbfbf8; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:10px; font-size:12px; flex-wrap:wrap;
  }
  #mpp-root .filterbar label{color:#5a5a4a; white-space:nowrap; font-weight:500;}
  #mpp-root .qt-filter-toggle{
    display:flex; align-items:center; gap:5px; margin-left:auto; font-weight:500; cursor:pointer;
  }
  #mpp-root .qt-filter-toggle input{margin:0; accent-color:#e0ab2c;}
  #mpp-root .filterbar .hint{color:var(--muted); font-weight:400;}
  #mpp-root .filterbar input{
    flex:0 1 320px; font-size:13px; padding:7px 10px; border:1px solid var(--line); border-radius:9px; background:#fff;
  }
  #mpp-root .filterbar input:focus{outline:none; border-color:var(--brand-end); box-shadow:0 0 0 3px rgba(117,139,41,.15);}
  #mpp-root .filterbar select{
    font-size:13px; padding:7px 10px; border:1px solid var(--line); border-radius:9px; background:#fff; color:var(--ink);
  }
  #mpp-root .filterbar select:focus{outline:none; border-color:var(--brand-end); box-shadow:0 0 0 3px rgba(117,139,41,.15);}
  #mpp-root .filterbar button{
    border:1px solid var(--line); background:#fff; color:#5a5a4a; width:26px; height:26px;
    border-radius:9px; cursor:pointer; font-size:14px; line-height:1;
  }
  #mpp-root .filterbar button:hover{background:#f1f3ea; border-color:var(--brand-end); color:var(--brand-end);}
  #mpp-root mark.name-hit{background:#ffe066; color:inherit; padding:0 2px; border-radius:3px;}
  #mpp-root .colpanel{
    padding:clamp(8px,1.2vw,12px) clamp(16px,2vw,26px); background:#fff; border-bottom:1px solid var(--line);
    display:flex; gap:14px; flex-wrap:wrap; font-size:12px; align-items:center;
  }
  #mpp-root .colpanel label{display:flex; align-items:center; gap:5px; cursor:pointer; white-space:nowrap; color:#4a4a3d;}
  #mpp-root .colpanel input{margin:0; accent-color:var(--brand-end);}
  #mpp-root .viz-btn{
    margin-left:auto; background:linear-gradient(135deg, var(--brand-start), var(--brand-end)) !important;
    color:#16180f !important; border:none !important; box-shadow:0 4px 12px rgba(117,139,41,.3);
  }
  #mpp-root .body{max-height:78vh; overflow:auto; position:relative; background:#fff;}
  #mpp-root table{border-collapse:collapse; width:100%; font-size:12.5px; table-layout:fixed;}
  #mpp-root thead th{
    position:sticky; top:0; background:#f6f7f2; text-align:left; padding:9px 10px;
    border-bottom:1px solid var(--line); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:#6b6b5c; z-index:2;
  }
  #mpp-root tbody tr{border-bottom:1px solid #f0f1e9; cursor:default; height:27px; transition:background .1s ease;}
  #mpp-root tbody tr.spacer{border-bottom:none;}
  #mpp-root tbody tr:hover{background:#f6f8ef;}
  #mpp-root tbody tr.summary{background:#f6f7f2; font-weight:600;}
  #mpp-root tbody tr.critical td.name{color:var(--critical); font-weight:600;}
  #mpp-root td{padding:6px 10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #mpp-root td.num{font-variant-numeric:tabular-nums; text-align:right; color:#4a4a3d;}
  #mpp-root td.name{white-space:normal; min-width:220px;}
  #mpp-root .tree-cell{display:flex; align-items:center; gap:5px;}
  #mpp-root .toggle{
    width:16px; height:16px; border:1px solid var(--line); color:var(--brand-end); font-size:11px;
    display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex:none; border-radius:5px; background:#fff;
    transition:all .12s ease;
  }
  #mpp-root .toggle:hover{background:var(--brand-start); color:#16180f; border-color:transparent;}
  #mpp-root .toggle.leaf{visibility:hidden;}
  #mpp-root .quick-task-btn{
    width:17px; height:17px; border:1px solid #c9cbb9; color:#7a7a68; font-size:9.5px;
    display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex:none; border-radius:50%;
    background:#fff; opacity:.45; transition:all .12s ease; line-height:1; padding:0;
  }
  #mpp-root tbody tr:hover .quick-task-btn{opacity:1;}
  #mpp-root .quick-task-btn:hover{background:#eceee2; border-color:#8e8d85; color:#4a4a3d;}
  #mpp-root .quick-task-btn.quick-task-btn-done{
    opacity:1; background:#ffe066; border-color:#e0ab2c; color:#5c4a00;
  }
  #mpp-root .quick-task-btn.quick-task-btn-done:hover{background:#ffd93d;}
  #mpp-root.quick-task-mode tbody tr:not(.quick-task-target):not(.quick-task-row){opacity:.28; filter:saturate(.4);}
  #mpp-root tbody tr.quick-task-target{background:#f1f6e2 !important;}
  #mpp-root tbody tr.quick-task-target .quick-task-btn{opacity:1; background:var(--brand-start); color:#16180f; border-color:transparent;}
  #mpp-root tbody tr.quick-task-row{background:#fff;}
  #mpp-root tbody tr.quick-task-row td{padding:10px; white-space:normal;}
  #mpp-root .qt-row-inner{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  #mpp-root .qt-row-inner input[type="text"]{
    flex:1 1 260px; font-size:13px; padding:7px 10px; border:1px solid var(--brand-end); border-radius:8px;
  }
  #mpp-root .qt-row-inner input[type="number"]{
    width:110px; font-size:13px; padding:7px 10px; border:1px solid var(--brand-end); border-radius:8px;
  }
  #mpp-root .qt-row-inner select{
    font-size:13px; padding:7px 10px; border:1px solid var(--brand-end); border-radius:8px; background:#fff;
  }
  #mpp-root .qt-row-inner input:focus, #mpp-root .qt-row-inner select:focus{
    outline:none; box-shadow:0 0 0 3px rgba(117,139,41,.18);
  }
  #mpp-root .qt-hint{font-size:11px; color:var(--muted); white-space:nowrap;}
  #mpp-root .qt-editor{display:flex; flex-direction:column; gap:8px;}
  #mpp-root .qt-editor .qt-row-inner:not(:first-child){padding-top:8px; border-top:1px dashed #dfe3d2;}
  #mpp-root .qt-line-num{
    flex:none; width:18px; height:18px; border-radius:50%; background:#eceee2; color:#6b6b5c;
    font-size:10px; font-weight:700; display:inline-flex; align-items:center; justify-content:center;
  }
  #mpp-root tbody tr.quick-task-summary{background:#fbfbf7;}
  #mpp-root tbody tr.quick-task-summary td{padding:8px 10px; white-space:normal;}
  #mpp-root .qt-summary{display:flex; flex-direction:column; gap:3px;}
  #mpp-root .qt-summary-line{font-size:12px; color:#4a4a3d;}
  #mpp-root .qt-summary-line b{color:#5c4a00; font-weight:700;}
  #mpp-root .indent{display:inline-block;}
  #mpp-root .milestone-mark{color:var(--critical); margin-right:2px;}
  #mpp-root .pct-bar{width:64px; height:7px; background:#eceee2; border-radius:6px; position:relative; display:inline-block; vertical-align:middle; overflow:hidden;}
  #mpp-root .pct-fill{position:absolute; left:0; top:0; bottom:0; background:linear-gradient(90deg, var(--brand-start), var(--brand-end)); border-radius:6px;}
  #mpp-root .pct-fill.crit{background:var(--critical);}
  #mpp-root .wbs-tag{font-size:10.5px; color:#8e8d85; font-weight:500;}

  /* Gantt */
  #mpp-root .gantt-wrap{display:flex; min-width:100%;}
  #mpp-root .gantt-labels{flex:none; width:280px; border-right:2px solid var(--ink); position:relative; background:#fff;}
  #mpp-root .gantt-labels .row, #mpp-root .gantt-chart .row{
    height:24px; border-bottom:1px solid #f0f1e9; display:flex; align-items:center; font-size:11.5px;
  }
  #mpp-root .gantt-labels .row{padding:0 10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #mpp-root .gantt-chart{position:relative; flex:1; background-image:linear-gradient(to right, var(--grid) 1px, transparent 1px); background-size:28px 100%;}
  #mpp-root .gantt-chart .row{position:relative;}
  #mpp-root .bar{position:absolute; height:13px; top:5.5px; border-radius:5px; background:linear-gradient(90deg, var(--brand-start), var(--brand-end));}
  #mpp-root .bar.crit{background:linear-gradient(90deg, #d9705a, var(--critical));}
  #mpp-root .bar.summary{background:var(--ink); height:6px; top:9px; border-radius:3px;}
  #mpp-root .bar .fill{position:absolute; left:0; top:0; bottom:0; background:rgba(255,255,255,.45); border-radius:5px 0 0 5px;}
  #mpp-root .diamond{position:absolute; top:4px; width:14px; height:14px; background:var(--critical); transform:rotate(45deg); border-radius:3px;}
  #mpp-root .month-axis{display:flex; position:sticky; top:0; background:#f6f7f2; z-index:2; border-bottom:1px solid var(--line); font-size:10.5px; color:#6b6b5c; height:22px;}
  #mpp-root .month-axis .label{border-right:1px solid var(--line); padding:4px 6px; white-space:nowrap; overflow:hidden;}
  #mpp-root .gantt-rows{position:absolute; left:0; right:0;}
  #mpp-root .empty-hint{padding:48px; text-align:center; color:var(--muted); font-size:13px;}
  #mpp-root .view{display:none;}
  #mpp-root .view.active{display:block;}
  #mpp-root tbody tr:not(.spacer){cursor:pointer;}
  #mpp-root .gantt-labels .row, #mpp-root .gantt-chart .row{cursor:pointer;}
  #mpp-root .row-highlight{background:#ffe89b !important; box-shadow:inset 0 0 0 2px #e0ab2c; transition:background .15s ease;}
  #mpp-root th .col-resizer{
    position:absolute; right:0; top:0; bottom:0; width:6px; cursor:col-resize; user-select:none;
  }
  #mpp-root th .col-resizer:hover, #mpp-root th .col-resizer.resizing{background:var(--brand-end);}
  #mpp-root #level-slider{
    -webkit-appearance:none; appearance:none; background:linear-gradient(90deg, #dfe3d2 0%, #dfe3d2 100%);
    border-radius:5px; height:5px; outline:none;
  }
  #mpp-root #level-slider::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:16px; height:16px; border-radius:50%;
    background:linear-gradient(135deg, var(--brand-start), var(--brand-end)); cursor:pointer;
    box-shadow:0 2px 6px rgba(117,139,41,.3); border:none;
  }
  #mpp-root #level-slider::-moz-range-thumb{
    width:16px; height:16px; border-radius:50%; background:linear-gradient(135deg, var(--brand-start), var(--brand-end));
    cursor:pointer; box-shadow:0 2px 6px rgba(117,139,41,.3); border:none;
  }
  #mpp-root #level-slider::-moz-range-track{background:transparent; border:none;}
  #mpp-root #level-slider::-moz-range-progress{background:#dfe3d2; height:5px; border-radius:5px;}

  /* Modal de detalle de tarea */
  #mpp-modal-overlay{
    position:fixed; inset:0; background:rgba(20,21,15,.55); backdrop-filter:blur(2px); display:none;
    align-items:center; justify-content:center; z-index:1000; font-family:'Inter',system-ui,sans-serif;
  }
  #mpp-modal-overlay.active{display:flex;}
  #mpp-modal{
    background:#fff; width:min(640px, 92vw); max-height:82vh; overflow:auto;
    border-radius:18px; box-shadow:0 24px 64px rgba(0,0,0,.35); color:var(--ink, #1c1d18);
  }
  #mpp-modal .modal-hdr{
    background:linear-gradient(120deg, #23241c, #1c1d18 60%); color:#fff; padding:16px 20px; display:flex; align-items:center;
    justify-content:space-between; gap:10px; position:sticky; top:0;
    border-bottom:3px solid; border-image:linear-gradient(90deg, #a2c617, #758b29) 1;
  }
  #mpp-modal .modal-hdr h2{font-size:14px; margin:0; font-weight:700;}
  #mpp-modal .modal-close{
    background:none; border:none; color:#fff; font-size:20px; cursor:pointer; line-height:1; padding:0 4px; opacity:.8;
  }
  #mpp-modal .modal-close:hover{opacity:1;}
  #mpp-modal .modal-body{padding:18px 20px;}
  #mpp-modal .field-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 18px;}
  #mpp-modal .field{font-size:12.5px; border-bottom:1px solid #f0f1e9; padding:5px 0;}
  #mpp-modal .field .flabel{font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:#8e8d85; display:block; margin-bottom:1px;}
  #mpp-modal .rel-section{margin-top:14px;}
  #mpp-modal .rel-section h3{font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:#8e8d85; margin:0 0 7px;}
  #mpp-modal .rel-chip{
    display:inline-flex; align-items:center; gap:4px; background:#f1f3ea; border:1px solid #dfe3d2;
    border-radius:999px; padding:4px 12px; font-size:11.5px; margin:0 6px 6px 0; cursor:pointer; color:#4a4a3d;
    transition:all .12s ease;
  }
  #mpp-modal .rel-chip:hover{background:var(--brand-start, #a2c617); border-color:transparent; color:#16180f;}
  #mpp-modal .rel-empty{font-size:11.5px; color:#8e8d85;}
  body{margin:0; padding:clamp(10px,2vw,24px); background:#f2f3ec; min-height:100vh; zoom:0.8;}

  #splash{
    position:fixed; inset:0; background:#ffffff; z-index:5000;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
    transition:opacity .4s ease; font-family:'Inter',system-ui,sans-serif;
  }
  #splash.out{opacity:0; pointer-events:none;}
  #splash .splash-logo{width:min(260px, 48vw); height:auto;}
  #splash .splash-spinner{
    width:22px; height:22px; border-radius:50%;
    border:3px solid #e6e7df; border-top-color:#758b29; border-right-color:#a2c617;
    animation:splash-spin 1s linear infinite;
  }
  @keyframes splash-spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
<div id="splash">
  <img src="assets/logoPAC.png" alt="Logo" class="splash-logo">
  <div class="splash-spinner"></div>
</div>
<div id="mpp-root">
  <div class="hdr">
    <div class="hdr-brand">
      <img src="assets/LogoIngeurbe.png" alt="Ingeurbe" class="hdr-logo">
      <h1>Programa de obra</h1>
    </div>
    <div class="sub" id="mpp-summary">Selecciona un proyecto para comenzar.</div>
    <button id="btn-generate-acta" style="display:none; margin-left:auto; background:linear-gradient(135deg, #ffd700, #ffb300); color:#16180f; border:none; padding:9px 18px; border-radius:10px; font-weight:700; cursor:pointer; font-size:12.5px; box-shadow:0 4px 12px rgba(255,183,0,.3);">📄 Generar Acta</button>
  </div>

  <div class="projectbar">
    <label for="project-select">Proyecto</label>
    <select id="project-select"><option value="">Cargando lista de proyectos...</option></select>
    <button id="btn-load-project" disabled>Cargar programación</button>
    <span class="status" id="project-status"></span>
  </div>

  <div class="toolbar" id="toolbar" style="display:none">
    <button id="btn-table" class="active">Tabla</button>
    <button id="btn-gantt">Gantt</button>
    <span style="width:1px;background:#e6e7df;height:18px;"></span>
    <button id="btn-expand-all">Expandir todo</button>
    <div id="level-slider-container" style="display:none; display:flex; align-items:center; gap:8px; margin-left:8px;">
      <label for="level-slider" style="font-size:12px; color:#4a4a3d; font-weight:500; white-space:nowrap;">Nivel:</label>
      <input type="range" id="level-slider" min="0" max="0" value="0" style="width:140px; cursor:pointer;">
      <span id="level-label" style="font-size:12px; color:#6b6b5c; min-width:60px;">Todo colapsado</span>
    </div>
    <button id="btn-toggle-columns" style="margin-left:auto">Columnas ▾</button>
  </div>

  <div class="filterbar" id="filterbar" style="display:none">
    <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap; flex:1;">
      <div style="display:flex; align-items:center; gap:6px;">
        <label for="name-filter" style="font-size:12px; white-space:nowrap;">Filtrar por nombre:</label>
        <input type="text" id="name-filter" placeholder="p. ej. Mam..." style="flex:0 1 200px;">
        <button id="btn-clear-filter" title="Limpiar filtro">&times;</button>
      </div>

      <span style="width:1px; background:#dfe3d2; height:18px;"></span>

      <div style="display:flex; align-items:center; gap:6px;">
        <label style="font-size:12px; white-space:nowrap;">Filtrar por fecha:</label>
        <select id="date-filter-field" style="flex:0 1 140px;">
          <option value="">Campo...</option>
          <option value="start">Inicio</option>
          <option value="finish">Fin</option>
          <option value="actual_start">Inicio real</option>
          <option value="baseline_start">Inicio línea base</option>
          <option value="baseline_finish">Fin línea base</option>
        </select>
        <select id="date-filter-category" style="flex:0 1 120px;">
          <option value="">Categoría...</option>
          <option value="before">Antes de hoy</option>
          <option value="1w">1 semana</option>
          <option value="3w">3 semanas</option>
          <option value="6w">6 semanas</option>
          <option value="3m">3 meses</option>
          <option value="6m">6 meses</option>
        </select>
        <button id="btn-clear-date-filter" title="Limpiar filtro de fecha">&times;</button>
      </div>

      <span style="width:1px; background:#dfe3d2; height:18px;"></span>

      <div style="display:flex; align-items:center; gap:6px;">
        <label for="default-contractor" style="font-size:12px; white-space:nowrap;">Contratista:</label>
        <select id="default-contractor" style="flex:0 1 160px;"><option value="">Sin preseleccionar</option></select>
      </div>
    </div>

    <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-left:auto;">
      <label class="qt-filter-toggle"><input type="checkbox" id="filter-programmed"> Solo programadas</label>
      <select id="group-by-contractor" style="display:none;">
        <option value="">Sin agrupar</option>
        <option value="contractor">Agrupar por contratista</option>
      </select>
    </div>
  </div>

  <div class="colpanel" id="colpanel" style="display:none"></div>

  <div class="body" id="mpp-body">
    <div class="empty-hint">Selecciona un proyecto arriba y pulsa "Cargar programación".</div>
  </div>
</div>

<div id="mpp-modal-overlay">
  <div id="mpp-modal">
    <div class="modal-hdr">
      <h2 id="mpp-modal-title">Tarea</h2>
      <button class="modal-close" id="mpp-modal-close" aria-label="Cerrar">&times;</button>
    </div>
    <div class="modal-body" id="mpp-modal-body"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
(function(){
  const splashEl = document.getElementById('splash');
  setTimeout(() => {
    splashEl.classList.add('out');
    setTimeout(() => splashEl.remove(), 450);
  }, 2000);

  const NUM_COLS = new Set(['cost','duration','baseline_duration','total_slack','free_slack','actual_duration','remaining_duration','priority']);

  const COLUMNS = [
    {key:'wbs', label:'WBS', default:true},
    {key:'name', label:'Nombre', default:true, fixed:true},
    {key:'start', label:'Inicio', default:true},
    {key:'finish', label:'Fin', default:true},
    {key:'duration', label:'Duración', default:true},
    {key:'pct', label:'% Avance', default:true},
    {key:'critical', label:'Crítica', default:false},
    {key:'predecessors', label:'Predecesoras', default:false},
    {key:'successors', label:'Sucesoras', default:false},
    {key:'resources', label:'Recursos', default:false},
    {key:'cost', label:'Costo', default:false},
    {key:'notes', label:'Notas', default:false},
    {key:'baseline_start', label:'Inicio línea base', default:true},
    {key:'baseline_finish', label:'Fin línea base', default:true},
    {key:'baseline_duration', label:'Duración línea base', default:false},
    {key:'total_slack', label:'Holgura total', default:false},
    {key:'free_slack', label:'Holgura libre', default:false},
    {key:'actual_start', label:'Inicio real', default:true},
    {key:'actual_duration', label:'Duración real', default:true},
    {key:'remaining_duration', label:'Duración restante', default:false},
    {key:'constraint_type', label:'Tipo de restricción', default:false},
    {key:'priority', label:'Prioridad', default:false},
    {key:'task_type', label:'Tipo de tarea', default:false},
  ];
  const FIELD_LABELS = COLUMNS.filter(c => !['name','predecessors','successors'].includes(c.key));

  // --- Estado del proyecto actualmente cargado (se reasigna en loadProject) ---
  let raw = [];
  let tree = [];
  let expanded = new Set();
  let taskById = new Map();
  let currentProjectName = '';
  let GLOBAL_MIN_DATE = new Date(), GLOBAL_MAX_DATE = new Date();
  let cachedRows = null;
  let nameFilter = '';
  let dateFilterField = '';
  let dateFilterCategory = '';
  let filteredCache = null;
  let filteredCacheKey = null;
  let colWidths = { name: 260 };
  let currentView = 'table';
  let highlightedId = null;
  let highlightTimer = null;
  let groupByContractor = false;

  // Programacion rapida de tareas asociadas (solo en memoria, sin persistencia)
  // Varias entradas por actividad: taskId -> [{text, qty, unit, contractor}, ...]
  const QUICK_TASK_UNITS = ['Piso', 'm2', 'Apartamento', 'Metro lineal', 'Punto fijo'];
  // Lista de contratistas de prueba por proyecto (placeholder hasta tener datos reales)
  const CONTRACTOR_LISTS = {
    'proyectoalbura': ['Constructora Albura SAS', 'Contratista Los Andes', 'Ingeniería del Valle', 'Obras y Diseños SAS'],
    'proyectocortezza': ['Cortezza Construcciones', 'Grupo Edifica', 'Contratistas Unidos', 'Constructora del Sur'],
  };
  const DEFAULT_CONTRACTORS = ['Contratista de prueba 1', 'Contratista de prueba 2', 'Contratista de prueba 3'];
  let currentContractors = [];
  let defaultContractor = '';
  const quickTasksByTask = new Map();
  let quickTaskRowId = null;
  // Lineas del editor abierto: siempre termina en una linea en blanco lista
  // para seguir agregando; se le agrega una nueva en blanco automaticamente
  // en cuanto la ultima deja de estar vacia.
  let quickTaskDraftRows = [];
  let onlyProgrammed = false;

  function blankQuickTaskLine(){
    return { text: '', qty: '', unit: '', contractor: defaultContractor };
  }
  function quickTaskLineHasContent(d){
    return !!(d.text.trim() || d.qty);
  }

  function buildTree(rows){
    const stack = [];
    rows.forEach(r => {
      r.children = [];
      while(stack.length && stack[stack.length-1].level >= r.level) stack.pop();
      r.parent = stack.length ? stack[stack.length-1] : null;
      if (r.parent) r.parent.children.push(r);
      stack.push(r);
    });
    return rows.filter(r => !r.parent);
  }

  const colpanel = document.getElementById('colpanel');
  COLUMNS.forEach(c => {
    const lbl = document.createElement('label');
    lbl.innerHTML = '<input type="checkbox" data-col="'+c.key+'" '+(c.default?'checked':'')+(c.fixed?' disabled':'')+'> '+c.label;
    colpanel.appendChild(lbl);
  });
  const vizBtn = document.createElement('button');
  vizBtn.className = 'viz-btn'; vizBtn.textContent = 'Visualizar';
  colpanel.appendChild(vizBtn);

  function activeColumns(){
    return COLUMNS.filter(c => c.fixed || colpanel.querySelector('[data-col="'+c.key+'"]').checked);
  }

  function parseDate(s){ return s ? new Date(s+'T00:00:00') : null; }

  // Filtro por categoria de fecha: ventanas exclusivas consecutivas desde hoy
  const TODAY = (() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); })();
  const DAY_MS = 86400000;
  function dateCategoryRange(cat){
    switch(cat){
      case 'before': return { start: null, end: TODAY };
      case '1w': return { start: TODAY, end: new Date(TODAY.getTime() + 7*DAY_MS) };
      case '3w': return { start: new Date(TODAY.getTime() + 7*DAY_MS), end: new Date(TODAY.getTime() + 21*DAY_MS) };
      case '6w': return { start: new Date(TODAY.getTime() + 21*DAY_MS), end: new Date(TODAY.getTime() + 42*DAY_MS) };
      case '3m': return { start: new Date(TODAY.getTime() + 42*DAY_MS), end: new Date(TODAY.getTime() + 90*DAY_MS) };
      case '6m': return { start: new Date(TODAY.getTime() + 90*DAY_MS), end: new Date(TODAY.getTime() + 180*DAY_MS) };
      default: return null;
    }
  }
  function matchesDateFilter(r){
    if (!dateFilterField || !dateFilterCategory) return true;
    const d = parseDate(r[dateFilterField]);
    if (!d) return false;
    const range = dateCategoryRange(dateFilterCategory);
    if (range.start !== null && d < range.start) return false;
    if (range.end !== null && d >= range.end) return false;
    return true;
  }
  function isAnyFilterActive(){
    return !!nameFilter || !!(dateFilterField && dateFilterCategory) || onlyProgrammed;
  }

  function visibleRows(){
    if (cachedRows) return cachedRows;
    const out = [];
    function walk(node){
      out.push(node);
      if (expanded.has(node.id)) node.children.forEach(walk);
    }
    tree.forEach(walk);
    cachedRows = out;
    return out;
  }
  function invalidateRows(){ cachedRows = null; }

  function getDisplayRows(){
    if (!isAnyFilterActive()) return visibleRows();
    const key = nameFilter + '|' + dateFilterField + '|' + dateFilterCategory + '|' + onlyProgrammed + '|' + quickTasksByTask.size + '|' + groupByContractor;
    if (filteredCacheKey !== key){
      let rows = raw.filter(r => {
        const nameOk = !nameFilter || (r.name || '').toLowerCase().includes(nameFilter);
        const programmedOk = !onlyProgrammed || quickTasksByTask.has(r.id);
        return nameOk && matchesDateFilter(r) && programmedOk;
      });

      if (onlyProgrammed && groupByContractor){
        const grouped = new Map();
        const seenByContractor = new Map();

        rows.forEach(r => {
          const tasks = quickTasksByTask.get(r.id) || [];
          tasks.forEach(task => {
            const contractor = task.contractor || '(Sin contratista)';
            if (!grouped.has(contractor)) {
              grouped.set(contractor, []);
              seenByContractor.set(contractor, new Set());
            }
            if (!seenByContractor.get(contractor).has(r.id)) {
              grouped.get(contractor).push(r);
              seenByContractor.get(contractor).add(r.id);
            }
          });
        });

        const result = [];
        const contractors = Array.from(grouped.keys()).sort();
        contractors.forEach(contractor => {
          result.push({
            contractorGroup: true,
            contractor: contractor,
            id: 'contractor-' + contractor,
            name: contractor,
            level: -1,
            children: []
          });
          grouped.get(contractor).forEach(r => result.push(r));
        });
        filteredCache = result;
      } else {
        filteredCache = rows;
      }
      filteredCacheKey = key;
    }
    return filteredCache;
  }

  function escapeHtml(s){
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function highlightMatches(text, needle){
    const safe = text || '';
    if (!needle) return escapeHtml(safe);
    const lower = safe.toLowerCase();
    let result = '', i = 0, idx;
    while ((idx = lower.indexOf(needle, i)) !== -1){
      result += escapeHtml(safe.slice(i, idx)) + '<mark class="name-hit">' + escapeHtml(safe.slice(idx, idx + needle.length)) + '</mark>';
      i = idx + needle.length;
    }
    result += escapeHtml(safe.slice(i));
    return result;
  }

  function parseIdList(str){
    return (str || '').split(',').map(s => s.trim()).filter(Boolean).map(s => parseInt(s, 10)).filter(n => !isNaN(n));
  }

  function fmtCell(row, key){
    switch(key){
      case 'pct': {
        const crit = row.critical ? 'crit' : '';
        return '<div class="tree-cell"><div class="pct-bar"><div class="pct-fill '+crit+'" style="width:'+row.pct+'%"></div></div><span style="font-family:Consolas,monospace;font-size:10px">'+row.pct.toFixed(0)+'%</span></div>';
      }
      case 'critical': return row.critical ? 'Sí' : '';
      case 'cost': return row.cost ? row.cost.toLocaleString('es-CO',{maximumFractionDigits:0}) : '';
      case 'wbs': return '<span class="wbs-tag">'+row.wbs+'</span>';
      case 'priority': return (row.priority === null || row.priority === undefined) ? '' : row.priority;
      default: return row[key] || '';
    }
  }

  function buildColgroup(cols){
    return '<colgroup>' + cols.map(c =>
      '<col' + (colWidths[c.key] ? ' style="width:'+colWidths[c.key]+'px"' : '') + '>'
    ).join('') + '</colgroup>';
  }

  const ROW_H_TABLE = 27;
  const ROW_H_GANTT = 24;
  const BUFFER = 20;

  function viewportSlice(total, rowH){
    const scrollTop = bodyEl.scrollTop;
    const viewportHeight = bodyEl.clientHeight || 600;
    let start = Math.floor(scrollTop / rowH) - BUFFER;
    let end = Math.ceil((scrollTop + viewportHeight) / rowH) + BUFFER;
    start = Math.max(0, start);
    end = Math.min(total, end);
    return {start, end};
  }

  function renderTable(){
    const cols = activeColumns();
    const isFiltering = isAnyFilterActive();
    const rows = getDisplayRows();

    if (isFiltering && rows.length === 0){
      return '<div class="empty-hint">Ninguna actividad coincide con los filtros activos.</div>';
    }

    const {start, end} = viewportSlice(rows.length, ROW_H_TABLE);
    const topH = start * ROW_H_TABLE;
    const bottomH = (rows.length - end) * ROW_H_TABLE;

    let html = '<table>' + buildColgroup(cols) + '<thead><tr>';
    cols.forEach(c => {
      if (c.key === 'name'){
        html += '<th>'+c.label+'<span class="col-resizer" data-col="name"></span></th>';
      } else {
        html += '<th>'+c.label+'</th>';
      }
    });
    html += '</tr></thead><tbody>';
    html += '<tr class="spacer" style="height:'+topH+'px"><td colspan="'+cols.length+'" style="padding:0;border:none;height:'+topH+'px"></td></tr>';
    for (let i = start; i < end; i++){
      const r = rows[i];

      if (r.contractorGroup){
        html += '<tr class="contractor-group-header">';
        cols.forEach((c, idx) => {
          if (idx === 0){
            html += '<td class="name" style="font-weight:700; background:#f1f3ea; padding:10px; border-top:2px solid #dfe3d2;">'+escapeHtml(r.contractor)+'</td>';
          } else {
            html += '<td style="background:#f1f3ea; border-top:2px solid #dfe3d2;"></td>';
          }
        });
        html += '</tr>';
        continue;
      }

      const isQuickTarget = r.id === quickTaskRowId;
      const cls = [r.summary?'summary':'', r.critical?'critical':'', isQuickTarget?'quick-task-target':''].join(' ');
      html += '<tr class="'+cls+'" data-row-id="'+r.id+'">';
      cols.forEach(c => {
        if (c.key === 'name'){
          const mile = r.milestone ? '<span class="milestone-mark">◆</span>' : '';
          const label = highlightMatches(r.name || '(sin nombre)', nameFilter);
          const hasKids = r.children.length > 0;
          // Solo se puede programar cantidad sobre actividades del ultimo nivel
          // (sin hijos), no sobre capitulos/resumenes.
          let qtBtn = '';
          if (!hasKids){
            const isProgrammed = quickTasksByTask.has(r.id);
            qtBtn = '<button type="button" class="quick-task-btn'+(isProgrammed?' quick-task-btn-done':'')+'" data-quick-task="'+r.id+'" title="'+(isProgrammed?'Ver/editar tarea programada':'Programar tarea asociada')+'">✎</button>';
          }
          if (isFiltering){
            html += '<td class="name"><div class="tree-cell">'+mile+label+qtBtn+'</div></td>';
          } else {
            const isOpen = expanded.has(r.id);
            const toggle = hasKids
              ? '<span class="toggle" data-toggle="'+r.id+'">'+(isOpen?'−':'+')+'</span>'
              : '<span class="toggle leaf">·</span>';
            html += '<td class="name"><div class="tree-cell" style="padding-left:'+(r.level*14)+'px">'+toggle+mile+label+qtBtn+'</div></td>';
          }
        } else if (NUM_COLS.has(c.key)) {
          html += '<td class="num">'+fmtCell(r,c.key)+'</td>';
        } else {
          html += '<td>'+fmtCell(r,c.key)+'</td>';
        }
      });
      html += '</tr>';
      if (isQuickTarget){
        html += renderQuickTaskRow(cols);
      } else if (onlyProgrammed && quickTasksByTask.has(r.id)){
        html += renderProgrammedSummary(cols, quickTasksByTask.get(r.id));
      }
    }
    html += '<tr class="spacer" style="height:'+bottomH+'px"><td colspan="'+cols.length+'" style="padding:0;border:none;height:'+bottomH+'px"></td></tr>';
    html += '</tbody></table>';
    return html;
  }

  function renderQtLine(i){
    const d = quickTaskDraftRows[i];
    const unitOptions = QUICK_TASK_UNITS.map(u =>
      '<option value="'+u+'"'+(d.unit === u ? ' selected' : '')+'>'+u+'</option>'
    ).join('');
    const contractorOptions = currentContractors.map(c =>
      '<option value="'+escapeHtml(c)+'"'+(d.contractor === c ? ' selected' : '')+'>'+escapeHtml(c)+'</option>'
    ).join('');
    return '<div class="qt-row-inner" data-qt-index="'+i+'">'+
      '<span class="qt-line-num">'+(i+1)+'</span>'+
      '<input type="text" class="qt-text" placeholder="Descripción de la tarea..." value="'+escapeHtml(d.text)+'">'+
      '<input type="number" class="qt-qty" placeholder="Cantidad" value="'+escapeHtml(d.qty)+'">'+
      '<select class="qt-unit"><option value="">Unidad...</option>'+unitOptions+'</select>'+
      '<select class="qt-contractor"><option value="">Contratista...</option>'+contractorOptions+'</select>'+
      (i === 0 ? '<span class="qt-hint">Enter para guardar · Esc para cancelar</span>' : '') +
    '</div>';
  }

  function renderQuickTaskRow(cols){
    const lines = quickTaskDraftRows.map((_, i) => renderQtLine(i)).join('');
    return '<tr class="quick-task-row"><td colspan="'+cols.length+'">'+
      '<div class="qt-editor">'+lines+'</div>'+
    '</td></tr>';
  }

  function renderProgrammedSummary(cols, entries){
    const lines = entries.map((t, i) =>
      '<div class="qt-summary-line"><b>Tarea '+(i+1)+':</b> '+escapeHtml(t.text || '(sin descripción)') +
      (t.qty ? ' — ' + escapeHtml(t.qty) + (t.unit ? ' ' + escapeHtml(t.unit) : '') : '') +
      (t.contractor ? ' · ' + escapeHtml(t.contractor) : '') +
      '</div>'
    ).join('');
    return '<tr class="quick-task-summary"><td colspan="'+cols.length+'"><div class="qt-summary">'+lines+'</div></td></tr>';
  }

  function renderGantt(){
    const rows = visibleRows();
    const minD = GLOBAL_MIN_DATE, maxD = GLOBAL_MAX_DATE;
    const totalDays = Math.max(1,(maxD-minD)/86400000);
    const pxPerDay = 4;
    const chartWidth = totalDays*pxPerDay;

    let months = [];
    let cur = new Date(minD.getFullYear(), minD.getMonth(), 1);
    while(cur <= maxD){
      const next = new Date(cur.getFullYear(), cur.getMonth()+1, 1);
      const width = Math.max(0,((next<maxD?next:maxD)-cur)/86400000)*pxPerDay;
      months.push('<div class="label" style="width:'+width+'px">'+cur.toLocaleDateString('es-CO',{month:'short',year:'2-digit'})+'</div>');
      cur = next;
    }

    const {start, end} = viewportSlice(rows.length, ROW_H_GANTT);
    const topH = start * ROW_H_GANTT;
    const totalH = rows.length * ROW_H_GANTT;

    let labelsHtml = '', barsHtml = '';
    for (let i = start; i < end; i++){
      const r = rows[i];
      labelsHtml += '<div class="row" data-row-id="'+r.id+'" style="padding-left:'+(r.level*10+8)+'px" title="'+ (r.name||'') +'">'+(r.name||'(sin nombre)')+'</div>';
      const s = parseDate(r.start), f = parseDate(r.finish);
      if (!s || !f){ barsHtml += '<div class="row" data-row-id="'+r.id+'"></div>'; continue; }
      const left = ((s-minD)/86400000)*pxPerDay;
      const width = Math.max(2, ((f-s)/86400000)*pxPerDay);
      if (r.milestone){
        barsHtml += '<div class="row" data-row-id="'+r.id+'"><div class="diamond" style="left:'+left+'px"></div></div>';
      } else {
        const cls = r.summary ? 'summary' : (r.critical ? 'crit' : '');
        barsHtml += '<div class="row" data-row-id="'+r.id+'"><div class="bar '+cls+'" style="left:'+left+'px;width:'+width+'px">'+
          (r.summary ? '' : '<div class="fill" style="width:'+r.pct+'%"></div>') + '</div></div>';
      }
    }

    return '<div class="gantt-wrap">'+
      '<div class="gantt-labels" style="height:'+(22+totalH)+'px">'+
        '<div class="month-axis"></div>'+
        '<div class="gantt-rows" style="top:'+(22+topH)+'px">'+labelsHtml+'</div>'+
      '</div>'+
      '<div class="gantt-chart" style="width:'+chartWidth+'px;height:'+(22+totalH)+'px">'+
        '<div class="month-axis">'+months.join('')+'</div>'+
        '<div class="gantt-rows" style="top:'+(22+topH)+'px">'+barsHtml+'</div>'+
      '</div>'+
    '</div>';
  }

  const bodyEl = document.getElementById('mpp-body');

  function wireToggles(){
    bodyEl.querySelectorAll('[data-toggle]').forEach(el => {
      el.addEventListener('click', (ev) => {
        ev.stopPropagation();
        const id = parseInt(el.getAttribute('data-toggle'));
        if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
        invalidateRows();
        renderBody();
      });
    });
  }

  function wireRowClicks(){
    bodyEl.querySelectorAll('[data-row-id]').forEach(el => {
      el.addEventListener('click', () => {
        const id = parseInt(el.getAttribute('data-row-id'));
        const task = taskById.get(id);
        if (task) openModal(task);
      });
    });
  }

  function wireColumnResize(){
    bodyEl.querySelectorAll('.col-resizer').forEach(handle => {
      handle.addEventListener('mousedown', (ev) => {
        ev.preventDefault();
        const key = handle.getAttribute('data-col');
        const table = handle.closest('table');
        const colIndex = activeColumns().findIndex(c => c.key === key);
        const colEl = table.querySelectorAll('colgroup col')[colIndex];
        const startX = ev.clientX;
        const startWidth = colEl.getBoundingClientRect().width;
        handle.classList.add('resizing');
        function onMove(e){
          const newWidth = Math.max(100, startWidth + (e.clientX - startX));
          colEl.style.width = newWidth + 'px';
          colWidths[key] = newWidth;
        }
        function onUp(){
          handle.classList.remove('resizing');
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    });
  }

  function applyHighlight(){
    if (highlightedId === null) return;
    bodyEl.querySelectorAll('[data-row-id="'+highlightedId+'"]').forEach(el => el.classList.add('row-highlight'));
  }

  const rootEl = document.getElementById('mpp-root');

  function openQuickTask(id){
    quickTaskRowId = id;
    const existing = quickTasksByTask.get(id);
    // Las tareas ya programadas conservan su propio contratista guardado;
    // siempre se agrega al final una linea en blanco lista para seguir
    // programando, prellenada con el contratista seleccionado para autocompletar.
    quickTaskDraftRows = existing ? existing.map(e => ({ ...e })) : [];
    quickTaskDraftRows.push(blankQuickTaskLine());
    rootEl.classList.add('quick-task-mode');
    renderBody();
  }

  function closeQuickTask(save){
    if (save && quickTaskRowId !== null){
      const filled = quickTaskDraftRows
        .filter(quickTaskLineHasContent)
        .map(d => ({ text: d.text.trim(), qty: d.qty, unit: d.unit, contractor: d.contractor }));
      if (filled.length) quickTasksByTask.set(quickTaskRowId, filled);
    }
    quickTaskRowId = null;
    quickTaskDraftRows = [];
    rootEl.classList.remove('quick-task-mode');
    updateActaButton();
    renderBody();
  }

  function wireQtLine(lineEl, i){
    const textEl = lineEl.querySelector('.qt-text');
    const qtyEl = lineEl.querySelector('.qt-qty');
    const unitEl = lineEl.querySelector('.qt-unit');
    const contractorEl = lineEl.querySelector('.qt-contractor');

    function growIfNeeded(){
      const isLast = i === quickTaskDraftRows.length - 1;
      if (!isLast || !quickTaskLineHasContent(quickTaskDraftRows[i])) return;
      // Se agrega una nueva linea en blanco insertandola directamente en el
      // DOM (sin volver a renderizar toda la tabla) para no perder el foco
      // ni el cursor de lo que se esta escribiendo justo ahora.
      quickTaskDraftRows.push(blankQuickTaskLine());
      const newIndex = quickTaskDraftRows.length - 1;
      const wrapper = document.createElement('div');
      wrapper.innerHTML = renderQtLine(newIndex);
      const newLineEl = wrapper.firstElementChild;
      lineEl.parentElement.appendChild(newLineEl);
      wireQtLine(newLineEl, newIndex);
    }

    textEl.addEventListener('input', () => { quickTaskDraftRows[i].text = textEl.value; growIfNeeded(); });
    qtyEl.addEventListener('input', () => { quickTaskDraftRows[i].qty = qtyEl.value; growIfNeeded(); });
    unitEl.addEventListener('change', () => { quickTaskDraftRows[i].unit = unitEl.value; });
    contractorEl.addEventListener('change', () => { quickTaskDraftRows[i].contractor = contractorEl.value; });

    // Enter/Escape se manejan de forma global (ver el listener de document
    // mas abajo), asi siguen funcionando aunque el foco se pierda tras un
    // re-render; aqui solo evitamos que el clic abra el modal de detalle.
    [textEl, qtyEl, unitEl, contractorEl].forEach(el => {
      el.addEventListener('click', ev => ev.stopPropagation());
    });
  }

  function wireQuickTask(){
    bodyEl.querySelectorAll('.quick-task-btn').forEach(btn => {
      btn.addEventListener('click', (ev) => {
        ev.stopPropagation();
        openQuickTask(parseInt(btn.getAttribute('data-quick-task')));
      });
    });

    const editor = bodyEl.querySelector('.qt-editor');
    if (!editor) return;
    editor.querySelectorAll('.qt-row-inner').forEach(lineEl => {
      wireQtLine(lineEl, parseInt(lineEl.getAttribute('data-qt-index')));
    });
    const firstText = editor.querySelector('.qt-text');
    if (firstText) firstText.focus();
  }

  function renderBody(){
    bodyEl.innerHTML = currentView === 'table' ? renderTable() : renderGantt();
    if (currentView === 'table'){
      wireToggles();
      wireColumnResize();
      wireQuickTask();
    }
    wireRowClicks();
    applyHighlight();
  }

  // --- Modal de detalle de tarea ---
  const modalOverlay = document.getElementById('mpp-modal-overlay');
  const modalTitle = document.getElementById('mpp-modal-title');
  const modalBody = document.getElementById('mpp-modal-body');
  const modalClose = document.getElementById('mpp-modal-close');

  function relChip(id){
    const t = taskById.get(id);
    const label = t ? (id + ' — ' + (t.name || '(sin nombre)')) : ('#' + id);
    return '<span class="rel-chip" data-goto="'+id+'">'+label+'</span>';
  }

  function openModal(task){
    modalTitle.textContent = (task.wbs ? task.wbs + ' · ' : '') + (task.name || '(sin nombre)');

    let html = '<div class="field-grid">';
    FIELD_LABELS.forEach(c => {
      let val = fmtCell(task, c.key);
      if (typeof val !== 'string') val = String(val);
      if (c.key === 'pct') val = (task.pct || 0).toFixed(0) + '%';
      if (c.key === 'wbs') val = task.wbs || '';
      if (c.key === 'critical') val = task.critical ? 'Sí' : 'No';
      html += '<div class="field"><span class="flabel">'+c.label+'</span>'+(val || '—')+'</div>';
    });
    html += '</div>';

    const preds = parseIdList(task.predecessors);
    const succs = parseIdList(task.successors);

    html += '<div class="rel-section"><h3>Predecesoras</h3>' +
      (preds.length ? preds.map(relChip).join('') : '<span class="rel-empty">Sin predecesoras</span>') +
      '</div>';
    html += '<div class="rel-section"><h3>Sucesoras</h3>' +
      (succs.length ? succs.map(relChip).join('') : '<span class="rel-empty">Sin sucesoras</span>') +
      '</div>';

    modalBody.innerHTML = html;
    modalBody.querySelectorAll('[data-goto]').forEach(chip => {
      chip.addEventListener('click', () => {
        const id = parseInt(chip.getAttribute('data-goto'));
        closeModal();
        highlightRow(id);
      });
    });

    modalOverlay.classList.add('active');
  }

  function closeModal(){
    modalOverlay.classList.remove('active');
  }

  modalClose.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', (ev) => {
    if (ev.target === modalOverlay) closeModal();
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') closeModal();
  });

  // Manejo global de Esc/Enter para la programacion rapida de tareas: no depende
  // de que el foco siga exactamente en el input/select del editor (por ejemplo,
  // tras un re-render por scroll el foco puede perderse), asi Esc siempre cierra
  // sin guardar mientras el editor este abierto.
  document.addEventListener('keydown', (ev) => {
    if (quickTaskRowId === null) return;
    if (ev.key === 'Escape'){
      ev.preventDefault();
      closeQuickTask(false);
    } else if (ev.key === 'Enter' && ev.target && ev.target.closest('.quick-task-row')){
      ev.preventDefault();
      closeQuickTask(true);
    }
  });

  function highlightRow(id){
    const task = taskById.get(id);
    if (!task) return;

    if (nameFilter){
      nameFilter = '';
      if (filterInput) filterInput.value = '';
    }
    if (dateFilterField || dateFilterCategory){
      dateFilterField = ''; dateFilterCategory = '';
      if (dateFilterFieldSelect) dateFilterFieldSelect.value = '';
      if (dateFilterCategorySelect) dateFilterCategorySelect.value = '';
    }
    if (onlyProgrammed){
      onlyProgrammed = false;
      groupByContractor = false;
      if (programmedFilterCheckbox) programmedFilterCheckbox.checked = false;
      if (groupByContractorSelect) { groupByContractorSelect.value = ''; groupByContractorSelect.style.display = 'none'; }
    }

    raw.forEach(r => expanded.add(r.id));
    invalidateRows();
    renderBody();

    const rows = visibleRows();
    const idx = rows.findIndex(r => r.id === id);
    if (idx === -1) return;

    const rowH = currentView === 'table' ? ROW_H_TABLE : ROW_H_GANTT;
    bodyEl.scrollTop = Math.max(0, idx * rowH - (bodyEl.clientHeight || 600) / 2);

    highlightedId = id;
    renderBody();

    requestAnimationFrame(() => {
      const rowEls = bodyEl.querySelectorAll('[data-row-id="'+id+'"]');
      if (!rowEls.length) return;
      const containerRect = bodyEl.getBoundingClientRect();
      const rowRect = rowEls[0].getBoundingClientRect();
      bodyEl.scrollTop += (rowRect.top + rowRect.height / 2) - (containerRect.top + containerRect.height / 2);

      if (currentView === 'gantt'){
        const chartRowEl = Array.from(rowEls).find(el => el.closest('.gantt-chart')) || rowEls[0];
        const barEl = chartRowEl.querySelector('.bar, .diamond') || chartRowEl;
        const barRect = barEl.getBoundingClientRect();
        bodyEl.scrollLeft += (barRect.left + barRect.width / 2) - (containerRect.left + containerRect.width / 2);
      }
    });

    if (highlightTimer) clearTimeout(highlightTimer);
    highlightTimer = setTimeout(() => {
      highlightedId = null;
      renderBody();
    }, 2200);
  }

  let scrollTicking = false;
  bodyEl.addEventListener('scroll', () => {
    if (scrollTicking) return;
    scrollTicking = true;
    requestAnimationFrame(() => {
      renderBody();
      scrollTicking = false;
    });
  });

  const filterInput = document.getElementById('name-filter');
  filterInput.addEventListener('input', () => {
    nameFilter = filterInput.value.trim().toLowerCase();
    bodyEl.scrollTop = 0;
    renderBody();
  });
  document.getElementById('btn-clear-filter').addEventListener('click', () => {
    filterInput.value = '';
    nameFilter = '';
    bodyEl.scrollTop = 0;
    renderBody();
  });

  const programmedFilterCheckbox = document.getElementById('filter-programmed');
  const groupByContractorSelect = document.getElementById('group-by-contractor');

  programmedFilterCheckbox.addEventListener('change', () => {
    onlyProgrammed = programmedFilterCheckbox.checked;
    groupByContractorSelect.style.display = onlyProgrammed ? '' : 'none';
    if (!onlyProgrammed){
      groupByContractor = false;
      groupByContractorSelect.value = '';
    }
    bodyEl.scrollTop = 0;
    renderBody();
  });

  groupByContractorSelect.addEventListener('change', () => {
    groupByContractor = groupByContractorSelect.value === 'contractor';
    bodyEl.scrollTop = 0;
    renderBody();
  });

  const dateFilterFieldSelect = document.getElementById('date-filter-field');
  const dateFilterCategorySelect = document.getElementById('date-filter-category');
  function onDateFilterChange(){
    dateFilterField = dateFilterFieldSelect.value;
    dateFilterCategory = dateFilterCategorySelect.value;
    bodyEl.scrollTop = 0;
    renderBody();
  }
  dateFilterFieldSelect.addEventListener('change', onDateFilterChange);
  dateFilterCategorySelect.addEventListener('change', onDateFilterChange);
  document.getElementById('btn-clear-date-filter').addEventListener('click', () => {
    dateFilterFieldSelect.value = '';
    dateFilterCategorySelect.value = '';
    dateFilterField = '';
    dateFilterCategory = '';
    bodyEl.scrollTop = 0;
    renderBody();
  });

  vizBtn.addEventListener('click', renderBody);
  document.getElementById('btn-table').addEventListener('click', function(){
    currentView='table'; this.classList.add('active'); document.getElementById('btn-gantt').classList.remove('active'); renderBody();
  });
  document.getElementById('btn-gantt').addEventListener('click', function(){
    if (quickTaskRowId !== null) closeQuickTask(false);
    currentView='gantt'; this.classList.add('active'); document.getElementById('btn-table').classList.remove('active'); renderBody();
  });
  document.getElementById('btn-expand-all').addEventListener('click', () => { raw.forEach(r=>expanded.add(r.id)); invalidateRows(); renderBody(); });

  const levelSliderContainer = document.getElementById('level-slider-container');
  const levelSlider = document.getElementById('level-slider');
  const levelLabel = document.getElementById('level-label');
  let maxLevelInProject = 0;

  function rebuildLevelButtons(){
    maxLevelInProject = raw.reduce((m, r) => Math.max(m, r.level), 0);
    levelSlider.max = maxLevelInProject;
    levelSlider.value = 0;
    levelSliderContainer.style.display = maxLevelInProject > 0 ? 'flex' : 'none';
    updateLevelLabel(0);
  }

  function updateLevelLabel(value){
    const v = parseInt(value);
    if (v === 0) levelLabel.textContent = 'Todo colapsado';
    else if (v === maxLevelInProject) levelLabel.textContent = 'Expandir todo';
    else levelLabel.textContent = 'Nivel ' + v;
  }

  levelSlider.addEventListener('input', (e) => {
    const level = parseInt(e.target.value);
    updateLevelLabel(level);
    expanded.clear();
    raw.forEach(r => { if (r.level < level) expanded.add(r.id); });
    invalidateRows();
    renderBody();
  });

  // --- Carga de proyectos (selector + fetch de manifest/JSON por proyecto) ---
  const summaryEl = document.getElementById('mpp-summary');
  const toolbarEl = document.getElementById('toolbar');
  const filterbarEl = document.getElementById('filterbar');
  const defaultContractorSelect = document.getElementById('default-contractor');
  const toggleColumnsBtn = document.getElementById('btn-toggle-columns');
  const projectSelect = document.getElementById('project-select');
  const loadBtn = document.getElementById('btn-load-project');
  const projectStatus = document.getElementById('project-status');

  defaultContractorSelect.addEventListener('change', () => {
    defaultContractor = defaultContractorSelect.value;
  });

  toggleColumnsBtn.addEventListener('click', () => {
    const isHidden = colpanel.style.display === 'none';
    colpanel.style.display = isHidden ? '' : 'none';
    toggleColumnsBtn.textContent = isHidden ? 'Ocultar columnas ▴' : 'Columnas ▾';
  });

  const btnGenerateActa = document.getElementById('btn-generate-acta');

  function updateActaButton(){
    btnGenerateActa.style.display = quickTasksByTask.size > 0 ? '' : 'none';
  }

  btnGenerateActa.addEventListener('click', generateActa);

  function generateActa(){
    const today = new Date();
    const actaDate = today.toLocaleDateString('es-CO', { year: 'numeric', month: 'long', day: 'numeric' });
    const closureDate = new Date(today.getTime() + 7 * 24 * 60 * 60 * 1000).toLocaleDateString('es-CO', { year: 'numeric', month: 'long', day: 'numeric' });

    // Agrupar tareas por contratista
    const grouped = new Map();
    quickTasksByTask.forEach((tasks, taskId) => {
      const task = taskById.get(taskId);
      if (!task) return;
      tasks.forEach(t => {
        const contractor = t.contractor || 'Sin contratista';
        if (!grouped.has(contractor)) grouped.set(contractor, []);
        grouped.get(contractor).push({ activity: task.name, ...t });
      });
    });

    const contractors = Array.from(grouped.keys()).sort();
    const totalTasks = Array.from(grouped.values()).reduce((sum, arr) => sum + arr.length, 0);

    let html = `
      <!DOCTYPE html>
      <html>
      <head>
        <meta charset="UTF-8">
        <style>
          * { margin: 0; padding: 0; box-sizing: border-box; }
          body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
          .container { max-width: 210mm; margin: 0 auto; padding: 20mm; background: #fff; }
          .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px; border-bottom: 3px solid #a2c617; padding-bottom: 20px; }
          .header-title h1 { font-size: 28px; color: #1c1d18; margin-bottom: 5px; font-weight: 700; }
          .header-title p { font-size: 13px; color: #8e8d85; font-weight: 500; }
          .header-logo { height: 50px; }
          .info-section { background: #f6f7f2; padding: 20px; border-radius: 8px; margin-bottom: 30px; }
          .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
          .info-item p:first-child { font-size: 11px; color: #8e8d85; font-weight: 600; text-transform: uppercase; margin-bottom: 8px; }
          .info-item p:last-child { font-size: 15px; color: #1c1d18; font-weight: 600; }
          .contractor-section { margin-bottom: 40px; page-break-inside: avoid; }
          .contractor-header { background: linear-gradient(135deg, #a2c617, #758b29); color: white; padding: 14px 18px; border-radius: 6px 6px 0 0; margin-bottom: 0; }
          .contractor-header h3 { font-size: 15px; margin: 0; font-weight: 700; }
          .task-table { width: 100%; border-collapse: collapse; border: 1px solid #dfe3d2; }
          .task-table th { background: #f6f7f2; padding: 12px 10px; text-align: left; font-size: 10px; font-weight: 700; color: #6b6b5c; text-transform: uppercase; border: 1px solid #dfe3d2; }
          .task-table td { padding: 11px 10px; font-size: 12px; color: #4a4a3d; border: 1px solid #dfe3d2; }
          .task-table tbody tr:nth-child(odd) { background: #ffffff; }
          .task-table tbody tr:nth-child(even) { background: #fbfbf8; }
          .contractor-total { background: #fbfbf8; padding: 12px 10px; border: 1px solid #dfe3d2; border-top: none; font-size: 12px; color: #6b6b5c; font-weight: 600; }
          .contractor-total strong { color: #758b29; }
          .signature-section { margin-top: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
          .signature-box { border-top: 2px solid #1c1d18; padding-top: 50px; text-align: center; }
          .signature-label { font-size: 11px; color: #8e8d85; font-weight: 600; text-transform: uppercase; margin-top: 10px; }
          .footer-info { background: #f6f7f2; padding: 15px 18px; border-radius: 8px; border-left: 4px solid #a2c617; margin-top: 40px; }
          .footer-info p { font-size: 11px; color: #6b6b5c; margin: 6px 0; }
          .footer-info p:first-child { font-weight: 600; text-transform: uppercase; color: #8e8d85; }
        </style>
      </head>
      <body>
        <div class="container">
          <div class="header">
            <div class="header-title">
              <h1>ACTA DE PROGRAMACIÓN</h1>
              <p>DE ACTIVIDADES</p>
            </div>
            <img src="assets/LogoIngeurbe.png" alt="Ingeurbe" class="header-logo">
          </div>

          <div class="info-section">
            <div class="info-grid">
              <div class="info-item">
                <p>Proyecto</p>
                <p>${escapeHtml(currentProjectName)}</p>
              </div>
              <div class="info-item">
                <p>Total de Tareas</p>
                <p style="color: #a2c617;">${totalTasks} actividades programadas</p>
              </div>
            </div>
            <div class="info-grid" style="margin-top: 20px;">
              <div class="info-item">
                <p>Fecha de Inicio</p>
                <p style="color: #758b29;">${actaDate}</p>
              </div>
              <div class="info-item">
                <p>Fecha de Cierre</p>
                <p style="color: #758b29;">${closureDate}</p>
              </div>
            </div>
          </div>
    `;

    contractors.forEach((contractor) => {
      const tasks = grouped.get(contractor);
      html += `
        <div class="contractor-section">
          <div class="contractor-header">
            <h3>${escapeHtml(contractor)}</h3>
          </div>
          <table class="task-table">
            <thead>
              <tr>
                <th style="width: 30%;">Actividad</th>
                <th style="width: 35%;">Tarea</th>
                <th style="width: 15%; text-align: center;">Cantidad</th>
                <th style="width: 20%;">Unidad</th>
              </tr>
            </thead>
            <tbody>
      `;

      tasks.forEach((t) => {
        html += `
          <tr>
            <td>${escapeHtml(t.activity || '—')}</td>
            <td>${escapeHtml(t.text || '—')}</td>
            <td style="text-align: center; font-weight: 600;">${escapeHtml(t.qty || '—')}</td>
            <td>${escapeHtml(t.unit || '—')}</td>
          </tr>
        `;
      });

      html += `
            </tbody>
          </table>
          <div class="contractor-total">
            <strong>Subtotal:</strong> ${tasks.length} ${tasks.length === 1 ? 'tarea' : 'tareas'}
          </div>
          <div class="signature-section" style="margin-top: 30px;">
            <div class="signature-box">
              <div style="height: 50px;"></div>
              <p class="signature-label">Firma Contratista</p>
              <p style="font-size: 10px; color: #8e8d85; margin-top: 5px;">${escapeHtml(contractor)}</p>
            </div>
            <div class="signature-box">
              <div style="height: 50px;"></div>
              <p class="signature-label">Supervisor de Obra</p>
            </div>
          </div>
        </div>
      `;
    });

    html += `
          <div class="footer-info">
            <p>Información del Documento</p>
            <p>Este acta fue generada automáticamente por el sistema de Programa de Obra de Ingeurbe.</p>
            <p>Generado: ${new Date().toLocaleString('es-CO')}</p>
          </div>
        </div>
      </body>
      </html>
    `;

    const element = document.createElement('div');
    element.innerHTML = html;
    document.body.appendChild(element);

    const opt = {
      margin: 10,
      filename: 'acta-programacion-' + currentProjectName.replace(/\s+/g, '-').toLowerCase() + '.pdf',
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true },
      jsPDF: { orientation: 'portrait', unit: 'mm', format: 'a4' }
    };

    html2pdf().set(opt).from(element).save().finally(() => {
      document.body.removeChild(element);
    });
  }

  function loadProject(tasks, label, slug){
    currentProjectName = label;
    raw = tasks;
    tree = buildTree(raw);
    expanded = new Set();
    raw.forEach(r => { if (r.level <= 0) expanded.add(r.id); });
    taskById = new Map(raw.map(r => [r.id, r]));

    GLOBAL_MIN_DATE = null; GLOBAL_MAX_DATE = null;
    raw.forEach(r => {
      const s = parseDate(r.start), f = parseDate(r.finish);
      if (s && (GLOBAL_MIN_DATE === null || s < GLOBAL_MIN_DATE)) GLOBAL_MIN_DATE = s;
      if (f && (GLOBAL_MAX_DATE === null || f > GLOBAL_MAX_DATE)) GLOBAL_MAX_DATE = f;
    });
    if (GLOBAL_MIN_DATE === null) GLOBAL_MIN_DATE = new Date();
    if (GLOBAL_MAX_DATE === null) GLOBAL_MAX_DATE = new Date();

    cachedRows = null;
    nameFilter = ''; filteredCache = null; filteredCacheKey = null;
    filterInput.value = '';
    dateFilterField = ''; dateFilterCategory = '';
    dateFilterFieldSelect.value = ''; dateFilterCategorySelect.value = '';
    colWidths = { name: 260 };
    highlightedId = null;
    if (highlightTimer) clearTimeout(highlightTimer);
    quickTaskRowId = null;
    quickTaskDraftRows = [];
    quickTasksByTask.clear();
    onlyProgrammed = false;
    groupByContractor = false;
    programmedFilterCheckbox.checked = false;
    groupByContractorSelect.value = '';
    groupByContractorSelect.style.display = 'none';
    rootEl.classList.remove('quick-task-mode');
    updateActaButton();

    currentContractors = CONTRACTOR_LISTS[slug] || DEFAULT_CONTRACTORS;
    defaultContractor = '';
    defaultContractorSelect.innerHTML = '<option value="">Sin preseleccionar</option>' +
      currentContractors.map(c => '<option value="'+escapeHtml(c)+'">'+escapeHtml(c)+'</option>').join('');

    currentView = 'table';
    document.getElementById('btn-table').classList.add('active');
    document.getElementById('btn-gantt').classList.remove('active');

    rebuildLevelButtons();

    summaryEl.textContent = label + ' · ' + raw.length + ' tareas · ' +
      (raw[0] ? raw[0].start : '') + ' — ' + (raw[0] ? raw[0].finish : '');

    toolbarEl.style.display = '';
    filterbarEl.style.display = '';
    colpanel.style.display = 'none';
    toggleColumnsBtn.textContent = 'Columnas ▾';

    bodyEl.scrollTop = 0;
    renderBody();
  }

  fetch('data/manifest.json')
    .then(r => {
      if (!r.ok) throw new Error('No se pudo cargar manifest.json (' + r.status + ')');
      return r.json();
    })
    .then(manifest => {
      if (!manifest.length){
        projectSelect.innerHTML = '<option value="">No hay proyectos disponibles</option>';
        return;
      }
      projectSelect.innerHTML = manifest.map(p =>
        '<option value="'+p.slug+'">'+escapeHtml(p.label)+' ('+p.taskCount+' tareas)</option>'
      ).join('');
      loadBtn.disabled = false;
    })
    .catch(err => {
      projectSelect.innerHTML = '<option value="">Error cargando proyectos</option>';
      projectStatus.textContent = String(err.message || err);
    });

  loadBtn.addEventListener('click', () => {
    const slug = projectSelect.value;
    if (!slug) return;
    const label = projectSelect.options[projectSelect.selectedIndex].textContent;
    loadBtn.disabled = true;
    projectStatus.textContent = 'Cargando ' + label + '...';
    fetch('data/' + slug + '.json')
      .then(r => {
        if (!r.ok) throw new Error('No se pudo cargar el proyecto (' + r.status + ')');
        return r.json();
      })
      .then(tasks => {
        loadProject(tasks, label, slug);
        projectStatus.textContent = '';
      })
      .catch(err => {
        projectStatus.textContent = 'Error: ' + String(err.message || err);
      })
      .finally(() => {
        loadBtn.disabled = false;
      });
  });
})();
</script>
</body>
</html>
