<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programa de obra</title>
<style>
  #mpp-root{
    --ink:#16233b; --paper:#f7f8fa; --line:#c7d0dd; --steel:#3e6b89;
    --critical:#d97a2b; --grid:#e2e7ee;
    font-family:'Segoe UI',Arial,sans-serif; color:var(--ink); background:var(--paper);
    border:1px solid var(--line); border-radius:2px; overflow:hidden;
  }
  #mpp-root *{box-sizing:border-box;}
  #mpp-root .hdr{
    background:var(--ink); color:#fff; padding:10px 14px;
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  #mpp-root .hdr h1{font-size:14px; font-weight:600; margin:0; letter-spacing:.03em; text-transform:uppercase;}
  #mpp-root .hdr .sub{font-size:11px; color:#a9b6ce; font-family:'Consolas',monospace;}
  #mpp-root .toolbar{
    display:flex; align-items:center; gap:8px; padding:8px 14px; background:#eef1f6;
    border-bottom:1px solid var(--line); flex-wrap:wrap;
  }
  #mpp-root .toolbar button{
    font-size:11px; padding:5px 10px; border:1px solid var(--steel); background:#fff; color:var(--steel);
    border-radius:2px; cursor:pointer; font-weight:600; letter-spacing:.02em;
  }
  #mpp-root .toolbar button.active{background:var(--steel); color:#fff;}
  #mpp-root .toolbar button:hover{opacity:.85;}
  #mpp-root .colpanel{
    padding:8px 14px; background:#fff; border-bottom:1px solid var(--line);
    display:flex; gap:12px; flex-wrap:wrap; font-size:11px;
  }
  #mpp-root .colpanel label{display:flex; align-items:center; gap:4px; cursor:pointer; white-space:nowrap;}
  #mpp-root .colpanel input{margin:0;}
  #mpp-root .viz-btn{
    margin-left:auto; background:var(--critical) !important; color:#fff !important; border-color:var(--critical) !important;
  }
  #mpp-root .body{max-height:78vh; overflow:auto; position:relative;}
  #mpp-root table{border-collapse:collapse; width:100%; font-size:12px; table-layout:fixed;}
  #mpp-root thead th{
    position:sticky; top:0; background:#dde3ec; text-align:left; padding:6px 8px;
    border-bottom:1px solid var(--line); font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:#4a5568; z-index:2;
  }
  #mpp-root tbody tr{border-bottom:1px solid #edf0f4; cursor:default; height:27px;}
  #mpp-root tbody tr.spacer{border-bottom:none;}
  #mpp-root tbody tr:hover{background:#eef4f8;}
  #mpp-root tbody tr.summary{background:#f1f3f7; font-weight:600;}
  #mpp-root tbody tr.critical td.name{color:var(--critical);}
  #mpp-root td{padding:5px 8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #mpp-root td.num{font-family:'Consolas',monospace; text-align:right;}
  #mpp-root td.name{white-space:normal; min-width:220px;}
  #mpp-root .tree-cell{display:flex; align-items:center; gap:4px;}
  #mpp-root .toggle{
    width:14px; height:14px; border:1px solid var(--steel); color:var(--steel); font-size:10px;
    display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex:none; border-radius:1px; background:#fff;
  }
  #mpp-root .toggle.leaf{visibility:hidden;}
  #mpp-root .indent{display:inline-block;}
  #mpp-root .milestone-mark{color:var(--critical); margin-right:2px;}
  #mpp-root .pct-bar{width:60px; height:8px; background:#e2e7ee; border-radius:1px; position:relative; display:inline-block; vertical-align:middle;}
  #mpp-root .pct-fill{position:absolute; left:0; top:0; bottom:0; background:var(--steel); border-radius:1px;}
  #mpp-root .pct-fill.crit{background:var(--critical);}
  #mpp-root .wbs-tag{font-family:'Consolas',monospace; font-size:10px; color:#7a869c;}

  /* Gantt */
  #mpp-root .gantt-wrap{display:flex; min-width:100%;}
  #mpp-root .gantt-labels{flex:none; width:280px; border-right:2px solid var(--ink); position:relative;}
  #mpp-root .gantt-labels .row, #mpp-root .gantt-chart .row{
    height:24px; border-bottom:1px solid #edf0f4; display:flex; align-items:center; font-size:11px;
  }
  #mpp-root .gantt-labels .row{padding:0 8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #mpp-root .gantt-chart{position:relative; flex:1; background-image:linear-gradient(to right, var(--grid) 1px, transparent 1px); background-size:28px 100%;}
  #mpp-root .gantt-chart .row{position:relative;}
  #mpp-root .bar{position:absolute; height:12px; top:6px; border-radius:2px; background:var(--steel);}
  #mpp-root .bar.crit{background:var(--critical);}
  #mpp-root .bar.summary{background:var(--ink); height:6px; top:9px;}
  #mpp-root .bar .fill{position:absolute; left:0; top:0; bottom:0; background:rgba(255,255,255,.45); border-radius:2px 0 0 2px;}
  #mpp-root .diamond{position:absolute; top:4px; width:14px; height:14px; background:var(--critical); transform:rotate(45deg); border-radius:2px;}
  #mpp-root .month-axis{display:flex; position:sticky; top:0; background:#dde3ec; z-index:2; border-bottom:1px solid var(--line); font-size:10px; color:#4a5568; font-family:'Consolas',monospace; height:22px;}
  #mpp-root .month-axis .label{border-right:1px solid var(--line); padding:4px 6px; white-space:nowrap; overflow:hidden;}
  #mpp-root .gantt-rows{position:absolute; left:0; right:0;}
  #mpp-root .empty-hint{padding:40px; text-align:center; color:#8592a6; font-size:12px;}
  #mpp-root .view{display:none;}
  #mpp-root .view.active{display:block;}
  #mpp-root tbody tr:not(.spacer){cursor:pointer;}
  #mpp-root .gantt-labels .row, #mpp-root .gantt-chart .row{cursor:pointer;}
  #mpp-root .row-highlight{background:#fdeecb !important;}

  /* Modal de detalle de tarea */
  #mpp-modal-overlay{
    position:fixed; inset:0; background:rgba(22,35,59,.55); display:none;
    align-items:center; justify-content:center; z-index:1000; font-family:'Segoe UI',Arial,sans-serif;
  }
  #mpp-modal-overlay.active{display:flex;}
  #mpp-modal{
    background:#fff; width:min(640px, 92vw); max-height:82vh; overflow:auto;
    border-radius:4px; box-shadow:0 12px 32px rgba(0,0,0,.35); color:#16233b;
  }
  #mpp-modal .modal-hdr{
    background:#16233b; color:#fff; padding:12px 16px; display:flex; align-items:center;
    justify-content:space-between; gap:10px; position:sticky; top:0;
  }
  #mpp-modal .modal-hdr h2{font-size:13px; margin:0; font-weight:600;}
  #mpp-modal .modal-close{
    background:none; border:none; color:#fff; font-size:18px; cursor:pointer; line-height:1; padding:0 4px;
  }
  #mpp-modal .modal-body{padding:14px 16px;}
  #mpp-modal .field-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px 16px;}
  #mpp-modal .field{font-size:12px; border-bottom:1px solid #edf0f4; padding:4px 0;}
  #mpp-modal .field .flabel{font-size:10px; text-transform:uppercase; letter-spacing:.03em; color:#7a869c; display:block;}
  #mpp-modal .rel-section{margin-top:12px;}
  #mpp-modal .rel-section h3{font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:#7a869c; margin:0 0 6px;}
  #mpp-modal .rel-chip{
    display:inline-flex; align-items:center; gap:4px; background:#eef1f6; border:1px solid #c7d0dd;
    border-radius:12px; padding:3px 10px; font-size:11px; margin:0 6px 6px 0; cursor:pointer;
  }
  #mpp-modal .rel-chip:hover{background:#dde3ec;}
  #mpp-modal .rel-empty{font-size:11px; color:#8592a6;}
  body{margin:0; padding:16px; background:#e9edf2;}
</style>
</head>
<body>
<div id="mpp-root">
  <div class="hdr">
    <h1>Programa de obra</h1>
    <div class="sub" id="mpp-summary">cargando...</div>
  </div>

  <div class="toolbar">
    <button id="btn-table" class="active">Tabla</button>
    <button id="btn-gantt">Gantt</button>
    <span style="width:1px;background:#c7d0dd;height:18px;"></span>
    <button id="btn-expand-all">Expandir todo</button>
    <button id="btn-collapse-all">Colapsar a nivel 2</button>
  </div>

  <div class="colpanel" id="colpanel"></div>

  <div class="body" id="mpp-body">
    <div class="empty-hint">Selecciona columnas y pulsa "Visualizar".</div>
  </div>
</div>

<div id="mpp-modal-overlay">
  <div id="mpp-modal">
    <div class="modal-hdr">
      <h2 id="mpp-modal-title">Tarea</h2>
      <button class="modal-close" id="mpp-modal-close" aria-label="Cerrar">&times;</button>
    </div>
    <div class="modal-body" id="mpp-modal-body"></div>
  </div>
</div>

<script id="mpp-data" type="application/json">__TASKS_JSON__</script>
<script>
(function(){
  const root = document.getElementById('mpp-root');
  const raw = JSON.parse(document.getElementById('mpp-data').textContent);

  const NUM_COLS = new Set(['cost','duration','baseline_duration','total_slack','free_slack','actual_duration','remaining_duration','priority']);

  const COLUMNS = [
    {key:'wbs', label:'WBS', default:true},
    {key:'name', label:'Nombre', default:true, fixed:true},
    {key:'start', label:'Inicio', default:true},
    {key:'finish', label:'Fin', default:true},
    {key:'duration', label:'Duración', default:true},
    {key:'pct', label:'% Avance', default:true},
    {key:'critical', label:'Crítica', default:false},
    {key:'predecessors', label:'Predecesoras', default:false},
    {key:'successors', label:'Sucesoras', default:true},
    {key:'resources', label:'Recursos', default:false},
    {key:'cost', label:'Costo', default:false},
    {key:'notes', label:'Notas', default:false},
    {key:'baseline_start', label:'Inicio línea base', default:true},
    {key:'baseline_finish', label:'Fin línea base', default:true},
    {key:'baseline_duration', label:'Duración línea base', default:true},
    {key:'total_slack', label:'Holgura total', default:true},
    {key:'free_slack', label:'Holgura libre', default:true},
    {key:'actual_start', label:'Inicio real', default:true},
    {key:'actual_duration', label:'Duración real', default:true},
    {key:'remaining_duration', label:'Duración restante', default:true},
    {key:'constraint_type', label:'Tipo de restricción', default:true},
    {key:'priority', label:'Prioridad', default:true},
    {key:'task_type', label:'Tipo de tarea', default:true},
  ];

  function buildTree(rows){
    const stack = [];
    rows.forEach(r => {
      r.children = [];
      while(stack.length && stack[stack.length-1].level >= r.level) stack.pop();
      r.parent = stack.length ? stack[stack.length-1] : null;
      if (r.parent) r.parent.children.push(r);
      stack.push(r);
    });
    return rows.filter(r => !r.parent);
  }
  const tree = buildTree(raw);

  const expanded = new Set();
  raw.forEach(r => { if (r.level <= 1) expanded.add(r.id); });

  document.getElementById('mpp-summary').textContent =
    raw.length + ' tareas · ' + (raw[0] ? raw[0].start : '') + ' — ' + (raw[0] ? raw[0].finish : '');

  const colpanel = document.getElementById('colpanel');
  COLUMNS.forEach(c => {
    const lbl = document.createElement('label');
    lbl.innerHTML = '<input type="checkbox" data-col="'+c.key+'" '+(c.default?'checked':'')+(c.fixed?' disabled':'')+'> '+c.label;
    colpanel.appendChild(lbl);
  });
  const vizBtn = document.createElement('button');
  vizBtn.className = 'viz-btn'; vizBtn.textContent = 'Visualizar';
  colpanel.appendChild(vizBtn);

  function activeColumns(){
    return COLUMNS.filter(c => c.fixed || colpanel.querySelector('[data-col="'+c.key+'"]').checked);
  }

  // fechas globales min/max: se calculan UNA sola vez, no en cada render de Gantt
  function parseDate(s){ return s ? new Date(s+'T00:00:00') : null; }
  let GLOBAL_MIN_DATE = null, GLOBAL_MAX_DATE = null;
  raw.forEach(r => {
    const s = parseDate(r.start), f = parseDate(r.finish);
    if (s && (GLOBAL_MIN_DATE === null || s < GLOBAL_MIN_DATE)) GLOBAL_MIN_DATE = s;
    if (f && (GLOBAL_MAX_DATE === null || f > GLOBAL_MAX_DATE)) GLOBAL_MAX_DATE = f;
  });
  if (GLOBAL_MIN_DATE === null) GLOBAL_MIN_DATE = new Date();
  if (GLOBAL_MAX_DATE === null) GLOBAL_MAX_DATE = new Date();

  // fila cacheada del árbol visible; se invalida solo cuando cambia expand/collapse
  let cachedRows = null;
  function visibleRows(){
    if (cachedRows) return cachedRows;
    const out = [];
    function walk(node){
      out.push(node);
      if (expanded.has(node.id)) node.children.forEach(walk);
    }
    tree.forEach(walk);
    cachedRows = out;
    return out;
  }
  function invalidateRows(){ cachedRows = null; }

  const taskById = new Map(raw.map(r => [r.id, r]));

  function parseIdList(str){
    return (str || '').split(',').map(s => s.trim()).filter(Boolean).map(s => parseInt(s, 10)).filter(n => !isNaN(n));
  }

  const FIELD_LABELS = COLUMNS.filter(c => !['name','predecessors','successors'].includes(c.key));

  function fmtCell(row, key){
    switch(key){
      case 'pct': {
        const crit = row.critical ? 'crit' : '';
        return '<div class="tree-cell"><div class="pct-bar"><div class="pct-fill '+crit+'" style="width:'+row.pct+'%"></div></div><span style="font-family:Consolas,monospace;font-size:10px">'+row.pct.toFixed(0)+'%</span></div>';
      }
      case 'critical': return row.critical ? 'Sí' : '';
      case 'cost': return row.cost ? row.cost.toLocaleString('es-CO',{maximumFractionDigits:0}) : '';
      case 'wbs': return '<span class="wbs-tag">'+row.wbs+'</span>';
      case 'priority': return (row.priority === null || row.priority === undefined) ? '' : row.priority;
      default: return row[key] || '';
    }
  }

  const ROW_H_TABLE = 27;
  const ROW_H_GANTT = 24;
  const BUFFER = 20;

  function viewportSlice(total, rowH){
    const scrollTop = bodyEl.scrollTop;
    const viewportHeight = bodyEl.clientHeight || 600;
    let start = Math.floor(scrollTop / rowH) - BUFFER;
    let end = Math.ceil((scrollTop + viewportHeight) / rowH) + BUFFER;
    start = Math.max(0, start);
    end = Math.min(total, end);
    return {start, end};
  }

  function renderTable(){
    const cols = activeColumns();
    const rows = visibleRows();
    const {start, end} = viewportSlice(rows.length, ROW_H_TABLE);
    const topH = start * ROW_H_TABLE;
    const bottomH = (rows.length - end) * ROW_H_TABLE;

    let html = '<table><thead><tr>';
    cols.forEach(c => html += '<th>'+c.label+'</th>');
    html += '</tr></thead><tbody>';
    html += '<tr class="spacer" style="height:'+topH+'px"><td colspan="'+cols.length+'" style="padding:0;border:none;height:'+topH+'px"></td></tr>';
    for (let i = start; i < end; i++){
      const r = rows[i];
      const cls = [r.summary?'summary':'', r.critical?'critical':''].join(' ');
      html += '<tr class="'+cls+'" data-row-id="'+r.id+'">';
      cols.forEach(c => {
        if (c.key === 'name'){
          const hasKids = r.children.length > 0;
          const isOpen = expanded.has(r.id);
          const toggle = hasKids
            ? '<span class="toggle" data-toggle="'+r.id+'">'+(isOpen?'−':'+')+'</span>'
            : '<span class="toggle leaf">·</span>';
          const mile = r.milestone ? '<span class="milestone-mark">◆</span>' : '';
          html += '<td class="name"><div class="tree-cell" style="padding-left:'+(r.level*14)+'px">'+toggle+mile+(r.name||'(sin nombre)')+'</div></td>';
        } else if (NUM_COLS.has(c.key)) {
          html += '<td class="num">'+fmtCell(r,c.key)+'</td>';
        } else {
          html += '<td>'+fmtCell(r,c.key)+'</td>';
        }
      });
      html += '</tr>';
    }
    html += '<tr class="spacer" style="height:'+bottomH+'px"><td colspan="'+cols.length+'" style="padding:0;border:none;height:'+bottomH+'px"></td></tr>';
    html += '</tbody></table>';
    return html;
  }

  function renderGantt(){
    const rows = visibleRows();
    const minD = GLOBAL_MIN_DATE, maxD = GLOBAL_MAX_DATE;
    const totalDays = Math.max(1,(maxD-minD)/86400000);
    const pxPerDay = 4;
    const chartWidth = totalDays*pxPerDay;

    let months = [];
    let cur = new Date(minD.getFullYear(), minD.getMonth(), 1);
    while(cur <= maxD){
      const next = new Date(cur.getFullYear(), cur.getMonth()+1, 1);
      const width = Math.max(0,((next<maxD?next:maxD)-cur)/86400000)*pxPerDay;
      months.push('<div class="label" style="width:'+width+'px">'+cur.toLocaleDateString('es-CO',{month:'short',year:'2-digit'})+'</div>');
      cur = next;
    }

    const {start, end} = viewportSlice(rows.length, ROW_H_GANTT);
    const topH = start * ROW_H_GANTT;
    const totalH = rows.length * ROW_H_GANTT;

    let labelsHtml = '', barsHtml = '';
    for (let i = start; i < end; i++){
      const r = rows[i];
      labelsHtml += '<div class="row" data-row-id="'+r.id+'" style="padding-left:'+(r.level*10+8)+'px" title="'+ (r.name||'') +'">'+(r.name||'(sin nombre)')+'</div>';
      const s = parseDate(r.start), f = parseDate(r.finish);
      if (!s || !f){ barsHtml += '<div class="row" data-row-id="'+r.id+'"></div>'; continue; }
      const left = ((s-minD)/86400000)*pxPerDay;
      const width = Math.max(2, ((f-s)/86400000)*pxPerDay);
      if (r.milestone){
        barsHtml += '<div class="row" data-row-id="'+r.id+'"><div class="diamond" style="left:'+left+'px"></div></div>';
      } else {
        const cls = r.summary ? 'summary' : (r.critical ? 'crit' : '');
        barsHtml += '<div class="row" data-row-id="'+r.id+'"><div class="bar '+cls+'" style="left:'+left+'px;width:'+width+'px">'+
          (r.summary ? '' : '<div class="fill" style="width:'+r.pct+'%"></div>') + '</div></div>';
      }
    }

    return '<div class="gantt-wrap">'+
      '<div class="gantt-labels" style="height:'+(22+totalH)+'px">'+
        '<div class="month-axis"></div>'+
        '<div class="gantt-rows" style="top:'+(22+topH)+'px">'+labelsHtml+'</div>'+
      '</div>'+
      '<div class="gantt-chart" style="width:'+chartWidth+'px;height:'+(22+totalH)+'px">'+
        '<div class="month-axis">'+months.join('')+'</div>'+
        '<div class="gantt-rows" style="top:'+(22+topH)+'px">'+barsHtml+'</div>'+
      '</div>'+
    '</div>';
  }

  const bodyEl = document.getElementById('mpp-body');
  let currentView = 'table';

  function wireToggles(){
    bodyEl.querySelectorAll('[data-toggle]').forEach(el => {
      el.addEventListener('click', (ev) => {
        ev.stopPropagation();
        const id = parseInt(el.getAttribute('data-toggle'));
        if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
        invalidateRows();
        renderBody();
      });
    });
  }

  function wireRowClicks(){
    bodyEl.querySelectorAll('[data-row-id]').forEach(el => {
      el.addEventListener('click', () => {
        const id = parseInt(el.getAttribute('data-row-id'));
        const task = taskById.get(id);
        if (task) openModal(task);
      });
    });
  }

  function renderBody(){
    bodyEl.innerHTML = currentView === 'table' ? renderTable() : renderGantt();
    if (currentView === 'table') wireToggles();
    wireRowClicks();
  }

  // --- Modal de detalle de tarea ---
  const modalOverlay = document.getElementById('mpp-modal-overlay');
  const modalTitle = document.getElementById('mpp-modal-title');
  const modalBody = document.getElementById('mpp-modal-body');
  const modalClose = document.getElementById('mpp-modal-close');

  function relChip(id){
    const t = taskById.get(id);
    const label = t ? (id + ' — ' + (t.name || '(sin nombre)')) : ('#' + id);
    return '<span class="rel-chip" data-goto="'+id+'">'+label+'</span>';
  }

  function openModal(task){
    modalTitle.textContent = (task.wbs ? task.wbs + ' · ' : '') + (task.name || '(sin nombre)');

    let html = '<div class="field-grid">';
    FIELD_LABELS.forEach(c => {
      let val = fmtCell(task, c.key);
      if (typeof val !== 'string') val = String(val);
      // fmtCell devuelve markup enriquecido para pct/wbs; para el modal preferimos texto plano en la mayoría
      if (c.key === 'pct') val = (task.pct || 0).toFixed(0) + '%';
      if (c.key === 'wbs') val = task.wbs || '';
      if (c.key === 'critical') val = task.critical ? 'Sí' : 'No';
      html += '<div class="field"><span class="flabel">'+c.label+'</span>'+(val || '—')+'</div>';
    });
    html += '</div>';

    const preds = parseIdList(task.predecessors);
    const succs = parseIdList(task.successors);

    html += '<div class="rel-section"><h3>Predecesoras</h3>' +
      (preds.length ? preds.map(relChip).join('') : '<span class="rel-empty">Sin predecesoras</span>') +
      '</div>';
    html += '<div class="rel-section"><h3>Sucesoras</h3>' +
      (succs.length ? succs.map(relChip).join('') : '<span class="rel-empty">Sin sucesoras</span>') +
      '</div>';

    modalBody.innerHTML = html;
    modalBody.querySelectorAll('[data-goto]').forEach(chip => {
      chip.addEventListener('click', () => {
        const id = parseInt(chip.getAttribute('data-goto'));
        closeModal();
        highlightRow(id);
      });
    });

    modalOverlay.classList.add('active');
  }

  function closeModal(){
    modalOverlay.classList.remove('active');
  }

  modalClose.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', (ev) => {
    if (ev.target === modalOverlay) closeModal();
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') closeModal();
  });

  function expandAncestors(task){
    let p = task.parent;
    let changed = false;
    while (p){
      if (!expanded.has(p.id)){ expanded.add(p.id); changed = true; }
      p = p.parent;
    }
    if (changed) invalidateRows();
  }

  function highlightRow(id){
    const task = taskById.get(id);
    if (!task) return;
    expandAncestors(task);

    const rows = visibleRows();
    const idx = rows.findIndex(r => r.id === id);
    if (idx === -1){ renderBody(); return; }

    const rowH = currentView === 'table' ? ROW_H_TABLE : ROW_H_GANTT;
    const targetTop = Math.max(0, idx * rowH - (bodyEl.clientHeight || 600) / 2);
    bodyEl.scrollTop = targetTop;
    renderBody();

    requestAnimationFrame(() => {
      bodyEl.querySelectorAll('[data-row-id="'+id+'"]').forEach(el => {
        el.classList.add('row-highlight');
        setTimeout(() => el.classList.remove('row-highlight'), 1800);
      });
    });
  }

  let scrollTicking = false;
  bodyEl.addEventListener('scroll', () => {
    if (scrollTicking) return;
    scrollTicking = true;
    requestAnimationFrame(() => {
      renderBody();
      scrollTicking = false;
    });
  });

  vizBtn.addEventListener('click', renderBody);
  document.getElementById('btn-table').addEventListener('click', function(){
    currentView='table'; this.classList.add('active'); document.getElementById('btn-gantt').classList.remove('active'); renderBody();
  });
  document.getElementById('btn-gantt').addEventListener('click', function(){
    currentView='gantt'; this.classList.add('active'); document.getElementById('btn-table').classList.remove('active'); renderBody();
  });
  document.getElementById('btn-expand-all').addEventListener('click', () => { raw.forEach(r=>expanded.add(r.id)); invalidateRows(); renderBody(); });
  document.getElementById('btn-collapse-all').addEventListener('click', () => { expanded.clear(); raw.forEach(r=>{if(r.level<=1) expanded.add(r.id);}); invalidateRows(); renderBody(); });

  renderBody();
})();
</script>
</body>
</html>
