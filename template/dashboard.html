<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero PAC</title>
<!-- .../dashboard lleva a la misma aplicacion en modo tablero (?vista=dashboard),
     conservando cualquier otro parametro (p. ej. pantalla=completa). -->

  var q = new URLSearchParams(location.search);
  q.set('vista', 'dashboard');
  location.replace('../index.html?' + q.toString());
</script>
<meta http-equiv="refresh" content="0; url=../index.html?vista=dashboard">
</head>
