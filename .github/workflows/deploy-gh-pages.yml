name: Deploy a GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inyectar token en HTML
        run: |
          TOKEN=${{ secrets.TOKEN_ACTAS }}

          if [ -z "$TOKEN" ]; then
            echo "❌ ERROR: TOKEN_ACTAS no está configurado en secrets"
            exit 1
          fi

          # Reemplazar el placeholder en el HTML
          sed -i "s/TOKEN_PLACEHOLDER/$TOKEN/g" template/visualizador.html

          echo "✅ Token inyectado correctamente"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'template'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
