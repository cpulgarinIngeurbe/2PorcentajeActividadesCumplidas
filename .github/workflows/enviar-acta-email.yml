name: Enviar acta por correo

on:
  repository_dispatch:
    types: [enviar_acta_email]

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install requests
          # Ghostscript: comprime el PDF del acta antes de adjuntarlo
          sudo apt-get update -qq && sudo apt-get install -y -qq ghostscript > /dev/null || echo "Sin ghostscript: el PDF va sin comprimir"

      - name: Enviar el acta por correo con el PDF adjunto (Microsoft Graph)
        env:
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          # Base para resolver las imagenes relativas del acta (logo) al
          # generar el PDF: la app publicada en GitHub Pages.
          BASE_URL: https://cpulgariningeurbe.github.io/2PorcentajeActividadesCumplidas/
        run: |
          import base64
          import json
          import os
          import re
          import shutil
          import subprocess
          import tempfile

          import requests

          # El payload se lee del archivo del evento (no de variables de
          # entorno): un acta grande supera el limite de ~128 KB por variable.
          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as f:
              payload = json.load(f).get('client_payload') or {}

          tenant_id = os.getenv('TENANT_ID')
          client_id = os.getenv('CLIENT_ID')
          client_secret = os.getenv('CLIENT_SECRET')
          mail_from = os.getenv('MAIL_FROM')
          destino = payload.get('destino') or ''
          proyecto = payload.get('proyecto') or 'Proyecto'
          fecha = payload.get('fecha') or ''
          html_body = payload.get('html') or ''

          # "destino" puede traer varios correos separados por coma o punto y
          # coma (el del proyecto y la copia fija); se quitan repetidos.
          destinos = []
          for c in re.split(r'[,;]', destino):
              c = c.strip()
              if c and c.lower() not in [d.lower() for d in destinos]:
                  destinos.append(c)
          if not destinos:
              print('[!] No hay correo destino en el payload, se omite el envio.')
              raise SystemExit(0)

          # --- PDF del acta: mismo HTML del cuerpo, sin el saludo, impreso
          # con el Chrome que trae el runner. Si falla, el correo sale igual
          # (sin adjunto) para no perder el envio.
          def generar_pdf(html):
              html = re.sub(r'<!--saludo-inicio-->.*?<!--saludo-fin-->', '', html, flags=re.S)
              extra = '<base href="' + os.environ['BASE_URL'] + '"><style>@page{size:A4;margin:10mm}</style>'
              if re.search(r'<head[^>]*>', html, flags=re.I):
                  html = re.sub(r'(<head[^>]*>)', lambda m: m.group(1) + extra, html, count=1, flags=re.I)
              else:
                  html = '<!doctype html><html><head><meta charset="utf-8">' + extra + '</head><body>' + html + '</body></html>'
              chrome = next((shutil.which(n) for n in ('google-chrome', 'google-chrome-stable', 'chromium-browser', 'chromium') if shutil.which(n)), None)
              if not chrome:
                  print('[!] No se encontro Chrome en el runner: se envia sin PDF.')
                  return None
              tmp = tempfile.mkdtemp()
              ruta_html = os.path.join(tmp, 'acta.html')
              ruta_pdf = os.path.join(tmp, 'acta.pdf')
              with open(ruta_html, 'w', encoding='utf-8') as f:
                  f.write(html)
              try:
                  subprocess.run([chrome, '--headless=new', '--no-sandbox', '--disable-gpu',
                                  '--no-pdf-header-footer', '--virtual-time-budget=10000',
                                  '--print-to-pdf=' + ruta_pdf, 'file://' + ruta_html],
                                 check=True, timeout=120, capture_output=True)
              except Exception as e:
                  print(f'[!] No se pudo generar el PDF: {e}')
                  return None
              if not os.path.exists(ruta_pdf):
                  print('[!] Chrome no genero el PDF: se envia sin adjunto.')
                  return None
              with open(ruta_pdf, 'rb') as f:
                  return f.read()

          # Compresion maxima con Ghostscript: imagenes a 72 ppp en JPEG,
          # fuentes en subconjunto y comprimidas, imagenes repetidas una
          # sola vez. Se queda con el resultado solo si de verdad pesa menos.
          def comprimir_pdf(pdf):
              gs = shutil.which('gs')
              if not gs or not pdf:
                  return pdf
              tmp = tempfile.mkdtemp()
              ent, sal = os.path.join(tmp, 'in.pdf'), os.path.join(tmp, 'out.pdf')
              with open(ent, 'wb') as f:
                  f.write(pdf)
              try:
                  subprocess.run([gs, '-sDEVICE=pdfwrite', '-dCompatibilityLevel=1.5', '-dPDFSETTINGS=/screen',
                                  '-dNOPAUSE', '-dQUIET', '-dBATCH', '-dSAFER',
                                  '-dDetectDuplicateImages=true', '-dCompressFonts=true', '-dSubsetFonts=true',
                                  '-dEmbedAllFonts=true', '-dCompressPages=true',
                                  '-dDownsampleColorImages=true', '-dColorImageDownsampleType=/Bicubic', '-dColorImageResolution=72',
                                  '-dDownsampleGrayImages=true', '-dGrayImageDownsampleType=/Bicubic', '-dGrayImageResolution=72',
                                  '-dDownsampleMonoImages=true', '-dMonoImageResolution=150',
                                  '-dAutoFilterColorImages=false', '-dColorImageFilter=/DCTEncode',
                                  '-dAutoFilterGrayImages=false', '-dGrayImageFilter=/DCTEncode',
                                  '-sOutputFile=' + sal, ent], check=True, timeout=120, capture_output=True)
                  with open(sal, 'rb') as f:
                      comprimido = f.read()
              except Exception as e:
                  print(f'[!] No se pudo comprimir el PDF: {e}')
                  return pdf
              if comprimido[:5] == b'%PDF-' and len(comprimido) < len(pdf):
                  print(f'[+] PDF comprimido: {len(pdf)//1024} KB -> {len(comprimido)//1024} KB')
                  return comprimido
              return pdf

          pdf = comprimir_pdf(generar_pdf(html_body))
          adjuntos = []
          if pdf:
              # sendMail admite adjuntos en linea de hasta ~3 MB
              if len(pdf) <= 3 * 1024 * 1024:
                  nombre = re.sub(r'[^\w\-]+', '-', f'Acta-programacion-{proyecto}-{fecha}').strip('-') + '.pdf'
                  adjuntos.append({
                      '@odata.type': '#microsoft.graph.fileAttachment',
                      'name': nombre,
                      'contentType': 'application/pdf',
                      'contentBytes': base64.b64encode(pdf).decode('ascii'),
                  })
                  print(f'[+] PDF generado ({len(pdf)//1024} KB): {nombre}')
              else:
                  print(f'[!] PDF de {len(pdf)//1024} KB supera 3 MB: se envia sin adjunto.')

          print('[*] Obteniendo token de acceso...')
          token_url = f'https://login.microsoftonline.com/{tenant_id}/oauth2/v2.0/token'
          token_data = {
              'grant_type': 'client_credentials',
              'client_id': client_id,
              'client_secret': client_secret,
              'scope': 'https://graph.microsoft.com/.default'
          }
          token_response = requests.post(token_url, data=token_data)
          if token_response.status_code != 200:
              print(f'[!] Error al obtener token: {token_response.text}')
              raise SystemExit(1)
          access_token = token_response.json()['access_token']
          print('[+] Token obtenido')

          message = {
              'subject': f'Acta de programación - {proyecto} - {fecha}',
              'body': {'contentType': 'HTML', 'content': html_body},
              'toRecipients': [{'emailAddress': {'address': c}} for c in destinos],
          }
          if adjuntos:
              message['attachments'] = adjuntos

          send_url = f'https://graph.microsoft.com/v1.0/users/{mail_from}/sendMail'
          headers = {'Authorization': f'Bearer {access_token}', 'Content-Type': 'application/json'}
          send_response = requests.post(send_url, json={'message': message, 'saveToSentItems': True}, headers=headers)

          if send_response.status_code in (200, 202):
              print(f'[+] Correo enviado a {", ".join(destinos)}' + (' con el PDF adjunto' if adjuntos else ' (sin PDF)'))
          else:
              print(f'[!] Error al enviar correo: {send_response.status_code}')
              print(f'[!] Respuesta: {send_response.text}')
              raise SystemExit(1)
        shell: python
