name: Procesar cronograma (.mpp -> Firestore)

# Disparado desde la app (submodulo de administrador) via la API de
# workflow_dispatch. El admin sube el .mpp al repo (mismo token embebido
# que usa el resto de la app) en cronogramas-pendientes/{slug}.mpp; ese
# commit llega al checkout de este job. Lo convierte a JSON con MPXJ y
# publica el resultado en Firestore, troceado y comprimido (igual que los
# modelos BIM). No usa Firebase Storage (requiere plan Blaze de pago).

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Slug del proyecto (ej. proyectoalbura)"
        required: true
      nombreProyecto:
        description: "Nombre visible del proyecto"
        required: true
      mppPath:
        description: "Ruta del .mpp dentro del repo (ej. cronogramas-pendientes/proyectoalbura.mpp)"
        required: true
      subidoPor:
        description: "Correo de quien subio el archivo"
        required: true

permissions:
  contents: read

jobs:
  procesar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install mpxj jpype1 firebase-admin

      - name: Escribir credencial de servicio
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"

      - name: Convertir y publicar en Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ runner.temp }}/firebase-sa.json
        run: |
          python scripts/procesar_cronograma.py "${{ inputs.mppPath }}" \
            "${{ inputs.slug }}" "${{ inputs.nombreProyecto }}" "${{ inputs.subidoPor }}"
