name: Inyectar Token de GitHub

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject-token:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inyectar token en HTML
        run: |
          TOKEN=${{ secrets.TOKEN_ACTAS }}

          if [ -z "$TOKEN" ]; then
            echo "❌ ERROR: TOKEN_ACTAS no está configurado en secrets"
            exit 1
          fi

          # Reemplazar el placeholder en el HTML
          sed -i "s/TOKEN_PLACEHOLDER/$TOKEN/g" template/visualizador.html

          echo "✅ Token inyectado en template/visualizador.html"

      - name: Commit y push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add template/visualizador.html

          if ! git diff --cached --quiet; then
            git commit -m "🔧 Inyecta token de GitHub automáticamente"
            git push
          else
            echo "Sin cambios"
          fi
