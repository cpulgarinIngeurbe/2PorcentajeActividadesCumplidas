name: Inyectar Token y Deploy a GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar archivos para GitHub Pages
        run: |
          # Crear directorio temporal para la build
          mkdir -p build

          # Copiar todo desde template
          cp -r template/* build/

          # Obtener el token
          TOKEN=${{ secrets.TOKEN_ACTAS }}

          if [ -z "$TOKEN" ]; then
            echo "❌ ERROR: TOKEN_ACTAS no está configurado en secrets"
            exit 1
          fi

          # Inyectar token en el HTML copiado (no en el original)
          sed -i "s|</head>|<script>window.GITHUB_TOKEN = '$TOKEN'; window.GITHUB_REPO = 'cpulgarinIngeurbe/2PorcentajeActividadesCumplidas';</script></head>|" build/visualizador.html

          echo "✅ Token inyectado y archivos listos para deploy"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
