name: Build y deploy visualizador

on:
  push:
    branches: [main]
    paths:
      - "data/**.mpp"
      - "data/**.zip"
      - "template/**"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install mpxj jpype1

      - name: Extraer tareas a JSON (todos los proyectos en data/)
        run: python scripts/extract.py data extracted_data

      - name: Construir sitio
        run: python scripts/build_html.py template/visualizador.html extracted_data _site

      - name: Inyectar token de GitHub en el sitio
        env:
          TOKEN_ACTAS: ${{ secrets.TOKEN_ACTAS }}
        run: python scripts/inject_token.py _site/index.html "$TOKEN_ACTAS" "cpulgarinIngeurbe/2PorcentajeActividadesCumplidas"

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
