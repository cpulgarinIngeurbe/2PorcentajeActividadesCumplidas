name: Build y deploy visualizador

on:
  push:
    branches: [main]
    paths:
      - "data/**.mpp"
      - "data/**.zip"
      - "template/**"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install mpxj jpype1

      - name: Descomprimir .zip si existe
        run: |
          mkdir -p data/_extracted
          shopt -s nullglob
          for z in data/*.zip; do
            echo "Descomprimiendo $z"
            unzip -o -j "$z" "*.mpp" -d data/_extracted
          done

      - name: Localizar archivo .mpp
        id: find_mpp
        run: |
          MPP_FILE=$(find data/_extracted data -maxdepth 1 -iname "*.mpp" 2>/dev/null | head -n 1)
          if [ -z "$MPP_FILE" ]; then
            echo "No se encontró ningún archivo .mpp (ni suelto ni dentro de un .zip) en data/" >&2
            exit 1
          fi
          echo "mpp_file=$MPP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extraer tareas a JSON
        run: python scripts/extract.py "${{ steps.find_mpp.outputs.mpp_file }}" tasks.json

      - name: Construir sitio
        run: |
          mkdir -p _site
          python scripts/build_html.py template/visualizador.html tasks.json _site/index.html

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
